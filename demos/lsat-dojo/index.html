t merely make the conclusion likely."],recipe:["Write what you have on the left.","Write what you need to prove on the right.","Find the missing arrow between them.","Plug the answer in and demand a 100% proof."],miniExample:{stimulus:"Nia is a pilot. Therefore Nia is licensed.",walkthrough:"Add 'Every pilot is licensed.' Now Nia -> pilot -> licensed. The conclusion cannot fail."}},strengthen:{plainJob:"Make the conclusion more believable. You do not need to prove it.",basics:["First find the conclusion; that is the claim you are helping.","Then find its weak spot: another cause, a bad comparison, or a missing link.","A strengthener protects that weak spot or adds fresh supporting evidence."],recipe:["Name the conclusion.","Imagine one reason it could be wrong.","Choose the answer that removes that reason or adds direct support.","Compare finalists: which one helps the most?"],miniExample:{stimulus:"Sunny plants grew taller, so sunlight helped.",walkthrough:"Learning that both groups had identical water and soil removes two rival causes. Sunlight becomes a better explanation."}},weaken:{plainJob:"Make the conclusion less believable. You do not have to prove the opposite.",basics:["The conclusion is a bridge supported by evidence.","To weaken, loosen one bolt in that bridge.","Common bolts are alternative causes, reversed cause and effect, and unfair comparisons."],recipe:["Name exactly what the author concludes.","Ask what else could explain the evidence.","Look for a fact the author forgot to rule out.","Pick the answer that does the most damage, not one that is merely negative."],miniExample:{stimulus:"The busiest cafe must have the best coffee.",walkthrough:"If it is the only cafe beside the train station, location explains the crowd. The coffee may still be good, but the argument is weaker."}},flaw:{plainJob:"Describe the exact reasoning mistake the author made.",basics:["A flaw answer talks about HOW the author reasoned, not whether the topic is good or bad.","First describe the move in your own words.","Then match it to the abstract wording in an answer choice."],recipe:["Separate evidence from conclusion.","Say: 'The author thinks ___ proves ___.'","Give one simple reason that proof can fail.","Choose the answer that describes that exact error."],miniExample:{stimulus:"If it rains, the street is wet. It did not rain, so the street is dry.",walkthrough:"The street could be wet from a sprinkler. The author treats rain as required when it was only one sufficient cause."}},inference:{plainJob:"Find the statement that has to be true using only the facts given.",basics:["Do not evaluate an argument; there may be no argument at all.","Treat each sentence as a puzzle piece.","The correct answer is forced. If it is merely likely, it is wrong."],recipe:["List the facts without adding common sense.","Connect rules that share a term.","Keep words like all, most, and some exact.","Try to imagine the answer being false. If you can, it is not required."],miniExample:{stimulus:"All gallery paintings are insured. Some are watercolors.",walkthrough:"At least one watercolor is insured. 'All watercolors are insured' goes too far beyond this gallery."}},paradox:{plainJob:"Explain how two facts that seem to clash can both be true.",basics:["Do not choose which fact is right; both are right.","The surprise comes from a hidden assumption connecting them.","The correct answer breaks that assumption or adds a missing difference."],recipe:["State the two surprising facts.","Finish: 'I expected ___ because I assumed ___.'","Look for an answer that makes the assumption false.","Check that it explains the direction of the surprise."],miniExample:{stimulus:"It rained heavily, but the reservoir fell.",walkthrough:"If the rain fell outside the reservoir's watershed, both facts make sense at once."}},method:{plainJob:"Describe the move the author made to reach the conclusion.",basics:["Method is the verb of the argument: compares, gives an example, rule ately states the main conclusion?",correct:`${o.proposal.charAt(0).toUpperCase()+o.proposal.slice(1)} ${o.c}.`,correctWhy:"It preserves the author's modest claim: consideration, not immediate adoption.",wrongs:[{text:o.over+".",why:"Far stronger than 'deserves serious consideration.'"},{text:`${o.support.charAt(0).toUpperCase()+o.support.slice(1)}.`,why:"This is supporting evidence."},{text:"The critics' concerns are entirely baseless.",why:"Calling one study weak does not erase every possible concern."},{text:`${o.weak.charAt(0).toUpperCase()+o.weak.slice(1)}.`,why:"This is a supporting criticism of opposing evidence."}],evidence:[o.support.toUpperCase()+".",`Opposing evidence is limited: ${o.weak}.`],conclusion:`${o.proposal.toUpperCase()} DESERVES SERIOUS CONSIDERATION.`,steps:[{title:"Notice where the conclusion sits",text:"The main claim opens the passage. The later facts support it."},{title:"Measure strength",text:"'Consider' is weaker than 'adopt,' and 'deserves' is weaker than 'must.'"},{title:"Reject attractive overstatement",text:"An answer can point in the author's direction and still be wrong because it claims too much."}],takeaway:"Main Conclusion answers must preserve force exactly. Consideration is not adoption; doubt is not disproof.",hints:["The conclusion may appear in the first sentence.","How strong is 'deserves serious consideration' compared with 'must adopt'?"]})}const f=R([{action:"extend routine screening to adults under forty",harm:"many false positives would prompt risky follow-up procedures",benefit:"early detection would help some patients",condition:"a substantially more specific test becomes available"},{action:"release all historical records immediately",harm:"many files reveal private information about living people",benefit:"release would help some researchers",condition:"reliable redaction can be performed first"},{action:"automate every initial loan decision",harm:"the current system creates many biased false rejections",benefit:
