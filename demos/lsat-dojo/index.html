em: Ben's cookie = a cookie from this jar."},{title:"Negation test",text:"Negate (B): 'Ben's cookie did NOT come from this jar.' The argument instantly collapses — the jar tells us nothing about outside cookies. Collapse = necessary assumption."}],why:["Ben's taste is irrelevant; the claim is about what the cookie contains.","✔ Bridges the jar (evidence) to Ben's cookie (conclusion). Negate it and the argument dies.","A fact about cookies generally does nothing to guarantee this particular cookie.","Other jars are outside the argument entirely."],takeaway:"New term in the conclusion → the assumption is the bridge to it. Confirm with the negation test."},{id:"assumption-2",type:"assumption",level:2,stimulus:"After Dalton installed LED streetlights last spring, the city's annual electricity bill for street lighting dropped by 20 percent. Clearly, LED lamps consume less electricity than the lamps they replaced.",question:"Which one of the following is an assumption required by the argument?",choices:["The price Dalton pays per unit of electricity did not fall last spring.","LED lamps cost more to install than conventional lamps.","Every conventional lamp in Dalton was replaced with an LED lamp.","No other city has reduced lighting costs by switching to LEDs."],answer:0,evidence:["LEDs installed last spring.","Street-lighting BILL fell 20%."],conclusion:"LEDs CONSUME less electricity than the old lamps.",steps:[{title:"Spot the term shift: money → energy",text:"The evidence is about dollars (the bill). The conclusion is about kilowatt-hours (consumption). A bill can fall because usage fell OR because the price fell."},{title:"Protect the inference",text:"For the bill drop to signal a usage drop, the author must assume the price side stayed put. That is exactly choice (A)."},{title:"Negate to confirm",text:"'Dalton's electricity price DID fall.' Now the 20% savings may be pure pricing, and the consumption claim loses its only support. Argument destroyed → (A) is required."},{title:"Kill the overreach",text:"(C) says EVERY lamp was replaced. Necessary assumptions are the minimum needed. Partial replacement would still support the conclusion, so (C) isn't required."}],why:["✔ Rules out the rival explanation (cheaper electricity) for the lower bill.","Installation cost is about money spent up front, not energy consumed.","Too strong — a partial switch could still explain lower consumption.","What other cities did is irrelevant to what happened in Dalton."],takeaway:"Cost evidence → consumption conclusion is a term shift. The necessary assumption usually blocks the alternative explanation."},{id:"assumption-3",type:"assumption",level:3,stimulus:"Critics charge that the museum's new acquisition policy has lowered the quality of its permanent collection. But since the policy took effect, attendance has risen by 30 percent, and visitors now rate the collection more highly than they did before. The critics are therefore mistaken.",question:"The argument requires the assumption that",choices:["visitor ratings are a more reliable measure of artistic quality than the judgments of critics","attendance figures and visitor ratings bear at least some relation to the quality of a collection","the rise in attendance was caused by the new acquisition policy rather than by advertising","no museum whose collection has declined in quality has ever experienced rising attendance","the critics have not examined the works acquired under the new policy"],answer:1,evidence:["Attendance +30%.","Visitor ratings up."],conclusion:"Critics are wrong — quality has NOT fallen.",steps:[{title:"Name the gap",text:"Popularity evidence is being used to refute a QUALITY claim. Popularity and quality are different concepts; the author silently treats one as evidence of the other."},{title:"Find the minimal bridge",text:"The author doesn't need popularity to be the best measure, or even a good one — only that it carries SOME evidentiary weight about quality."},{title:"Negation test on (B)",text:"'Attendance and ratings bear NO relation to quality.' Then the author has offered zero evidence and the conclusion is unsupported. Argument dies → required."},{title:"Why the strong answers fail",text:"(A) 'more reliable than critics' and (D) 'no museum ever' are far stronger than the argument needs. Negate (A): ratings are merely somewhat reliable — the argument still works. Not required."}],why:["Too strong: the argument survives even if expert judgment is the better measure, so long as ratings count for something.","✔ The minimum link between the popularity evidence and the quality conclusion. Negation guts the argument.","The cause of the attendance rise isn't needed; the ratings evidence alone could carry the argument.","An absolute 'never' claim — far more than the argument needs.","What the critics examined doesn't affect whether the author's evidence supports the conclusion."],takeaway:"Necessary assumptions are weak and minimal. When two answers bridge the same gap, pick the weaker one."},{id:"assumption-4",type:"assumption",level:4,stimulus:"Ecologist: The valley's aspen groves will recover only if elk browsing is the principal obstacle to aspen regeneration. Elk numbers have fallen by 40 percent since the drought began, yet no improvement in regeneration has been recorded. Nonetheless, the planned wolf reintroduction will cause the groves to recover.",question:"Which one of the following is an assumption on which the ecologist's argument depends?",choices:["Wolves will reduce the elk population by more than an additional 40 percent.","Drought stress, rather than elk browsing, is the principal obstacle to aspen regeneration.","Some condition present during the drought, and not expected to persist, accounts for the lack of improvement in regeneration despite lower elk numbers.","No aspen grove anywhere has recovered without a reduction in herbivore browsing.","Elk are the only large herbivores in the valley that browse on aspen."],answer:2,evidence:["Recovery possible ONLY IF elk browsing is the principal obstacle.","Elk down 40% → still no regeneration improvement."],conclusion:"Wolf reintroduction WILL cause the groves to recover.",steps:[{title:"Diagram the conditional",text:"Recover → elk browsing is the principal obstacle. The ecologist concludes recovery, so the ecologist is committed to elk browsing being the principal obstacle."},{title:"Notice the counter-evidence the author absorbed",text:"Fewer elk produced no improvement — which looks like proof that elk are NOT the principal obstacle. The author must defuse this, not accept it."},{title:"The only way to defuse it",text:"Something else must have masked the benefit during the drought AND must not continue. That is (C). Negate it: nothing temporary explains the non-improvement → elk browsing isn't the real obstacle → the conditional blocks recovery. Argument dead."},{title:"Trap patrol",text:"(A) assumes wolves work only by killing elk; they also change elk behavior and distribution — not required. (B) directly contradicts what the author needs."}],why:["Not required — wolves can relieve browsing by changing where and how elk feed, without further population loss.","Contradicts the author's commitment; if true, recovery is ruled out by the stated conditional.","✔ The only answer that reconciles the counter-evidence with the conclusion; negating it collapses the argument.","A universal claim about every grove on earth — vastly more than needed.","Other browsers may exist so long as elk browsing remains the principal obstacle."],takeaway:"When a stimulus contains evidence against its own conclusion, the required assumption is usually the one that explains that evidence away."},{id:"sufficient-1",type:"sufficient",level:1,stimulus:"Nora is a violinist. Therefore, Nora reads music.",question:"The conclusion follows logically if which one of the following is assumed?",choices:["All violinists read music.","Some violinists read music.","All people who read music are violinists.","Nora practices every day."],answer:0,evidence:["Nora is a violinist."],conclusion:"Nora reads music.",steps:[{title:"Write the arrow",text:"Premise: Nora → violinist. Conclusion: Nora → reads music. You need a link from violinist to reads-music."},{title:"Direction matters",text:"You need violinist → reads music. Choice (C) reverses it (reads music → violinist), which never gets you to Nora reading music."},{title:"Strength matters",text:"'Some' (B) never guarantees anything about a particular person. Sufficient Assumption answers are strong and universal."}],why:["✔ violinist → reads music. Plug Nora in and the conclusion is proven.","'Some' leaves open that Nora is one of the violinists who can't read music.","Reversed arrow — tells you nothing about violinists.","Practice has nothing to do with reading music."],takeaway:"Sufficient Assumption = the missing arrow, pointing from the premise term to the conclusion term."},{id:"sufficient-2",type:"sufficient",level:2,stimulus:"Any film shot on location is expensive to produce. Harbor Light was not shot in a studio. Therefore, Harbor Light was expensive to produce.",question:"The conclusion follows logically if which one of the following is assumed?",choices:["Any film not shot in a studio was shot on location.","Any film shot in a studio is inexpensive to produce.","Most expensive films are shot on location.","Harbor Light earned less at the box office than it cost."],answer:0,evidence:["On location → expensive.","Harbor Light: NOT in a studio."],conclusion:"Harbor Light was expensive.",steps:[{title:"Lay the chain on the table",text:"You have: not-studio (given about Harbor Light) … on location → expensive (rule). The chain is broken at one joint: not-studio to on-location."},{title:"Weld the joint",text:"Add 'not studio → on location' and the chain runs: Harbor Light → not studio → on location → expensive. Conclusion proven."},{title:"Beware the contrapositive imposter",text:"(B) 'studio → inexpensive' contraposes to 'expensive → not studio' — the wrong direction. It never reaches the conclusion."}],why:["✔ Welds not-studio to on-location, completing the chain to 'expensive'.","Wrong direction; tells you about studio films, not about Harbor Light.","'Most' statements cannot prove a conclusion about one film.","Box office is irrelevant to production cost."],takeaway:"Link premises end-to-end. The sufficient assumption is the one missing link, in the correct direction."},{id:"sufficient-3",type:"sufficient",level:3,stimulus:"Editor: A newspaper should publish a leaked document only if doing so serves the public interest. Publishing the Halloran memo would embarrass powerful officials who have deliberately misled the public. So the Times should publish the Halloran memo.",question:"The editor's conclusion follows logically if which one of the following is assumed?",choices:["Publishing the Halloran memo would serve the public interest.","A newspaper should publish any leaked document whose publication would embarrass officials who have deliberately misled the public.","Newspapers have an obligation to embarrass officials who mislead the public.","Any document that serves the public interest also embarrasses someone.","The Times has never declined to publish a document that serves the public interest."],answer:1,evidence:["Should publish ONLY IF serves public interest.","Publishing the memo WOULD embarrass deceitful officials."],conclusion:"The Times SHOULD publish the memo.",steps:[{title:"Translate 'only if'",text:"'Should publish only if it serves the public interest' = should publish → serves public interest. Public interest is NECESSARY, not sufficient."},{title:"See why (A) is the trap",text:"(A) only satisfies the necessary condition. Satisfying a necessary condition never proves the triggering condition. Meeting the minimum requirement for a job doesn't mean you're hired."},{title:"Build a sufficient rule instead",text:"You need a rule whose trigger you ALREADY have (embarrasses deceitful officials) and whose result is the conclusion (should publish). That's exactly (B)."},{title:"Check validity",text:"Memo embarrasses deceitful officials → (by B) should publish. Done — airtight, no gap left."}],why:["The classic trap: it only fulfills a necessary condition, which never establishes 'should publish'.","✔ Converts the premise you have into the conclusion you want. Fully sufficient.","'An obligation to embarrass' is not the same as an obligation to publish this document.","Reverses the relationship and still never licenses publishing.","A fact about past practice, not a rule that proves what should happen now."],takeaway:"'Only if' introduces a necessary condition. Satisfying it proves nothing — you need a rule that TRIGGERS the conclusion."},{id:"sufficient-4",type:"sufficient",level:4,stimulus:"Critic: No novel deserves the Aster Prize unless it is both formally inventive and emotionally resonant. Veil of Ash is emotionally resonant, and every novel written in the second person is formally inventive. Therefore, Veil of Ash deserves the Aster Prize.",question:"The critic's conclusion follows logically if which one of the following is assumed?",choices:["Veil of Ash is formally inventive.","Every novel that deserves the Aster Prize is both formally inventive and emotionally resonant.","Every novel written in the second person deserves the Aster Prize.","Veil of Ash is written in the second person, and every emotionally resonant novel that is formally inventive deserves the Aster Prize.","Some emotionally resonant novels written in the second person have won the Aster Prize."],answer:3,evidence:["Deserves prize → formally inventive AND emotionally resonant.","Veil of Ash: emotionally resonant.","2nd person → formally inventive."],conclusion:"Veil of Ash DESERVES the Aster Prize.",steps:[{title:"Audit what's missing — there are TWO holes",text:"Hole 1: we never learn that Veil of Ash is formally inventive. Hole 2: even with both traits, the opening rule is only NECESSARY ('unless'), so it can't deliver 'deserves'."},{title:"Reject half-answers",text:"(A) plugs hole 1 only. (B) merely restates the necessary condition and plugs nothing. A correct SA answer must seal every hole at once."},{title:"Why (C) fails",text:"(C) would prove it IF we knew Veil of Ash were second person — but we don't. It supplies a rule with an untriggered condition."},{title:"Verify (D)",text:"Veil of Ash is 2nd person → formally inventive (given rule). It's also emotionally resonant (given). Then by (D)'s sufficient rule → deserves the prize. Both holes sealed; conclusion proven."}],why:["Fills only one of two gaps; the necessary-condition rule still cannot yield 'deserves'.","Restates the stimulus's necessary condition — adds no proving power.","A rule whose trigger is never established for this novel.","✔ Supplies the missing fact AND the sufficient rule, completing the proof.","'Some ... have won' is anecdotal and cannot prove anything about this novel."],takeaway:"On hard SA questions, count the gaps first. The credited answer closes all of them simultaneously."},{id:"strengthen-1",type:"strengthen",level:1,stimulus:"The bean plants we put on the sunny windowsill grew taller than the bean plants we put in the dark closet. Sunlight must help bean plants grow.",question:"Which one of the following, if true, most strengthens the argument?",choices:["Bean plants are easy to grow indoors.","Both sets of plants were the same variety and received the same soil and water.","The closet was slightly cooler than the windowsill.","Some plants grow well in shade."],answer:1,evidence:["Sunny plants grew taller than closet plants."],conclusion:"Sunlight helps bean plants grow.",steps:[{title:"Find the gap",text:"The two groups differed in light — but did they differ in anything ELSE? If so, that other difference might be the real cause."},{title:"Strengthen = eliminate rival causes",text:"(B) says everything else was held constant, so light is the only difference left to explain the growth gap."},{title:"Note the opposite",text:"(C) introduces a second difference (temperature) — that WEAKENS by offering a rival explanation."}],why:["Doesn't address why one group grew taller.","✔ Holds everything but light constant, isolating sunlight as the cause.","Opposite — gives a rival cause for the difference.","Irrelevant to whether sunlight helped these bean plants."],takeaway:"For causal arguments, the fastest strengthener rules out alternative explanations."},{id:"strengthen-2",type:"strengthen",level:2,stimulus:"Two years ago Kearny added protected bike lanes downtown. Since then the number of cyclists injured downtown each year has fallen by 40 percent. The lanes have clearly made cycling downtown safer.",question:"Which one of the following, if true, most strengthens the argument?",choices:["The number of people cycling downtown has risen slightly over the past two years.","The bike lanes cost more to build than the city had budgeted.","Cyclist injuries also fell in neighboring towns that built no bike lanes.","Most downtown drivers say the lanes have made driving more difficult."],answer:0,evidence:["Protected lanes added.","Cyclist injuries down 40%."],conclusion:"Cycling downtown is SAFER.",steps:[{title:"Translate 'safer'",text:"Safety is a RATE: injuries per cyclist. The evidence gives only the raw number of injuries."},{title:"Find the lurking rival",text:"If far fewer people were cycling, injuries would fall without any safety gain. That possibility is the argument's soft spot."},{title:"Shut it down",text:"(A) says ridership actually rose. Fewer injuries among MORE riders means the per-rider risk dropped sharply. Gap closed."}],why:["✔ More riders plus fewer injuries means the injury rate truly fell.","Budget overruns say nothing about safety.","Weakens — suggests a region-wide trend unrelated to the lanes.","Driver convenience is beside the point."],takeaway:"When a conclusion is about a rate but the evidence is a raw count, the strengthener fixes the denominator."},{id:"strengthen-3",type:"strengthen",level:3,stimulus:"Researchers observed that office workers who took a fifteen-minute walk at midday scored higher on afternoon concentration tests than coworkers who remained at their desks. The researchers concluded that midday exercise improves afternoon concentration.",question:"Which one of the following, if true, most strengthens the researchers' conclusion?",choices:["Workers who walked at midday reported enjoying their jobs more than those who did not.","Afternoon concentration tests are also used to evaluate the effects of caffeine.","When workers were randomly assigned either to walk or to stay at their desks, the same difference in afternoon scores appeared.","The walkers and the non-walkers had similar scores on concentration tests given in the morning.","Walking at midday is more common in offices with flexible schedules."],answer:2,evidence:["Midday walkers outscored desk-sitters on afternoon tests."],conclusion:"Midday exercise IMPROVES afternoon concentration.",steps:[{title:"Diagnose the study design",text:"This is observational: workers CHOSE whether to walk. Self-selection means the groups may differ in energy, health, or workload from the start."},{title:"Rank the two live contenders",text:"(D) equalizes morning scores — helpful, it removes one background difference. (C) removes ALL systematic background differences at once by randomizing."},{title:"Why randomization wins",text:"Replicating the result under random assignment converts correlation into experimental evidence of causation. That is the strongest possible support here."},{title:"Technique",text:"On Strengthen, don't stop at the first answer that helps. Compare the finalists and pick the one that neutralizes the biggest threat."}],why:["Enjoyment isn't concentration, and it may itself be the confound.","Irrelevant background fact about the test instrument.","✔ Random assignment eliminates self-selection, the central threat to the causal claim.","Helpful but weaker — it rules out one prior difference, not the many others.","Points to a confound (flexible, less-pressured offices) — if anything, it weakens."],takeaway:"Observational study → causal claim? The best strengthener is evidence from randomization or a controlled comparison."},{id:"strengthen-4",type:"strengthen",level:4,stimulus:"Archaeologist: Charred grain in the storerooms at Tel Hazor is conventionally read as evidence that the city was destroyed in a conflagration. But the grain's carbon signature matches that produced by deliberate parching, a routine pre-storage practice. The storerooms therefore did not burn.",question:"Which one of the following, if true, most strengthens the archaeologist's argument?",choices:["Deliberate parching was practiced at several other sites in the region during the same period.","Grain charred in a structural fire is deformed and fused, whereas parched grain retains its shape; the Hazor grain retains its shape.","Some cities of the period were destroyed by earthquake rather than by fire.","The storerooms at Tel Hazor contained more grain than those at comparable sites.","Carbon signatures of parched and burned grain can be distinguished only by specialized equipment."],answer:1,evidence:["Charred grain usually read as fire-destruction evidence.","Grain's carbon signature matches deliberate parching."],conclusion:"The storerooms did NOT burn.",steps:[{title:"Catch the overreach",text:"Showing that parching could explain the charring shows only that the charring isn't proof of fire. It does NOT show there was no fire — the grain could have been parched AND the building later burned."},{title:"Identify what the author needs",text:"Independent physical evidence that a fire did not touch this grain — some marker that a real fire would have left behind but is absent."},{title:"Test (B)",text:"Fire deforms and fuses grain; the Hazor grain is undeformed. So the grain was not in a burning structure. This supplies the missing 'no fire' evidence directly."},{title:"Why (A) and (E) fall short",text:"(A) only makes parching plausible — the author already has that. (E) is about detection methods, not about whether a fire occurred."}],why:["Supports a point already granted; doesn't rule out a later fire.","✔ Adds affirmative physical evidence that no fire reached the grain, which is exactly what the conclusion needs.","Other cities' fates don't tell us about Hazor's storerooms.","Quantity of grain is irrelevant to whether it burned.","A methodological aside; neither supports nor undermines the fire claim."],takeaway:"An alternative explanation only neutralizes evidence. To prove the rival didn't happen, you need new affirmative evidence."},{id:"weaken-1",type:"weaken",level:1,stimulus:"The new café on Pine Street must serve the best coffee in town. It has the longest line of any café in town.",question:"Which one of the following, if true, most weakens the argument?",choices:["The café also sells pastries.","The café is the only one beside the train station, where thousands of commuters pass each morning.","The café opened just three months ago.","Some people in town prefer tea to coffee."],answer:1,evidence:["Longest line in town."],conclusion:"Best coffee in town.",steps:[{title:"State the leap",text:"Long line → best coffee. The author assumes the line length is caused by coffee quality."},{title:"Attack by rival cause",text:"Any other explanation for the long line breaks the link. Location beside a commuter hub explains the crowd without any claim about quality."},{title:"Note what weakening is NOT",text:"You don't have to prove the coffee is bad. Showing the evidence doesn't support the conclusion is enough."}],why:["Pastries don't explain away the coffee claim.","✔ Supplies a rival cause for the long line: convenience, not quality.","Age of the café doesn't bear on quality.","Tea drinkers are irrelevant to who is standing in the coffee line."],takeaway:"Weaken a causal claim by supplying an alternative cause."},{id:"weaken-2",type:"weaken",level:2,stimulus:"Students who eat breakfast score higher on standardized exams than students who skip it. Schools should therefore serve free breakfast in order to raise their students' exam scores.",question:"Which one of the following, if true, most weakens the argument?",choices:["Breakfast foods served at school are less nutritious than those eaten at home.","Students who eat breakfast tend to come from households that also provide tutoring and a quiet place to study.","Some students dislike eating early in the morning.","Free breakfast programs are expensive to administer."],answer:1,evidence:["Breakfast-eaters outscore breakfast-skippers."],conclusion:"Serving free breakfast will RAISE scores.",steps:[{title:"Correlation → causation → policy",text:"The argument makes two jumps: breakfast correlates with scores, so breakfast causes scores, so supplying breakfast will raise scores."},{title:"Hunt the common cause",text:"If a third factor (household resources) produces both the breakfast and the high scores, then adding breakfast alone changes nothing."},{title:"Compare with cost answers",text:"(D) attacks whether the policy is worth it, not whether it would work. Weaken questions target the stated conclusion — here, raising scores."}],why:["Nutritional detail doesn't address the causal link to scores.","✔ Classic confounding variable: household advantage causes both breakfast and higher scores.","A few preferences don't undercut the aggregate claim.","Cost is a separate objection; the conclusion is about effectiveness."],takeaway:"Confounding variable = the most common weakener for 'correlation therefore do X' arguments."},{id:"weaken-3",type:"weaken",level:3,stimulus:"Hospital administrator: Since we adopted the electronic records system eighteen months ago, the average time from a patient's arrival in our emergency department to the start of treatment has fallen by twelve minutes. Other hospitals seeking to shorten treatment delays should adopt the same system.",question:"Which one of the following, if true, most weakens the administrator's argument?",choices:["Some physicians at the hospital say the electronic system takes longer to use than paper charts.","The electronic records system was more expensive than the hospital had anticipated.","Fourteen months ago the hospital opened a second triage unit that diverts the least urgent cases out of the main emergency department.","At two other hospitals that adopted the system, average treatment delays fell by only four minutes.","The hospital's total number of emergency visits has remained constant over the past two years."],answer:2,evidence:["Adopted e-records 18 months ago.","Average arrival-to-treatment time down 12 minutes."],conclusion:"Other hospitals should adopt the system to cut delays.",steps:[{title:"Isolate the causal claim",text:"The recommendation rests on: the system caused the 12-minute drop. Anything else that could have caused the drop undermines it."},{title:"Spot the simultaneous change",text:"(C) introduces a second change at nearly the same time, and one that mechanically lowers the AVERAGE by removing slow, low-urgency cases from the pool."},{title:"Weigh (A) and (D)",text:"(A) is mere opinion that conflicts with the measured outcome — weak. (D) shows a smaller benefit elsewhere, which trims but does not undercut the causal story; (C) suggests the benefit may be zero."},{title:"Technique",text:"Rank weakeners by how much of the conclusion they destroy. Alternative cause > reduced magnitude > unsupported opinion."}],why:["Opinion contradicted by the measured result; weak at best.","Cost doesn't touch whether the system shortens delays.","✔ A concurrent change that independently explains the drop in average time.","Weakens slightly by shrinking the expected benefit, but the cause still holds.","Constant volume removes one rival explanation — it mildly STRENGTHENS."],takeaway:"Look for a second event occurring in the same window. Concurrent changes are the strongest alternative-cause weakeners."},{id:"weaken-4",type:"weaken",level:4,stimulus:"Economist: Firms offering unlimited paid leave report fewer days taken per employee than firms with fixed allowances. Critics infer that employees at unlimited-leave firms feel pressured not to take time off. But surveys show that these employees report greater satisfaction with their leave policy than employees at fixed-allowance firms do. The critics' inference is therefore unwarranted.",question:"Which one of the following, if true, most weakens the economist's argument?",choices:["Employees at unlimited-leave firms take longer individual vacations than employees at fixed-allowance firms.","Employees who feel pressured to minimize their time off are particularly likely to express approval of policies their employers publicly champion.","Some fixed-allowance firms permit employees to carry unused leave into the following year.","Unlimited-leave policies are most common at firms in rapidly growing industries.","Satisfaction surveys at unlimited-leave firms are administered annually rather than quarterly."],answer:1,evidence:["Unlimited-leave employees take FEWER days.","But they report HIGHER satisfaction with the policy."],conclusion:"The critics' 'pressure' explanation is unwarranted.",steps:[{title:"See what the evidence must do",text:"The economist's whole case is that high reported satisfaction is incompatible with felt pressure. The survey must be a trustworthy window into how employees actually feel."},{title:"Attack the instrument, not the conclusion",text:"If the very pressure the critics allege also inflates survey responses, then high satisfaction scores are exactly what the critics' hypothesis predicts. The economist's evidence stops being counter-evidence."},{title:"Confirm (B) does this",text:"(B) says pressured employees are especially likely to endorse employer-championed policies. The economist's rebuttal evaporates."},{title:"Why the others miss",text:"(A) actually helps the economist. (C), (D), (E) are background facts that never connect pressure to the survey responses."}],why:["Longer vacations suggest employees aren't suppressed — this supports the economist.","✔ Shows the satisfaction data is exactly what the critics' hypothesis would produce, nullifying the rebuttal.","A detail about the comparison group that doesn't address felt pressure.","Industry growth doesn't explain the satisfaction responses.","Survey frequency is too remote to undercut the reported satisfaction."],takeaway:"When an argument rests on self-reported data, the sharpest weakener shows the reports are biased in the predicted direction."},{id:"flaw-1",type:"flaw",level:1,stimulus:"Everyone who studied for the quiz passed it. Kim did not study for the quiz. So Kim did not pass it.",question:"The reasoning in the argument is flawed because the argument",choices:["treats a condition that is sufficient for passing as though it were required for passing","relies on the testimony of someone who is not an expert","draws a conclusion about a group from facts about one member","uses the word 'pass' in two different senses"],answer:0,evidence:["Studied → passed.","Kim did NOT study."],conclusion:"Kim did NOT pass.",steps:[{title:"Diagram it",text:"Studied → Passed. The author negates the left side and concludes the right side is negated too."},{title:"Name the error",text:"That's denying the antecedent. The rule guarantees studiers pass; it says nothing about non-studiers, who might pass anyway."},{title:"Translate into LSAT-speak",text:"The LSAT describes this as treating a SUFFICIENT condition as if it were NECESSARY — choice (A)."}],why:["✔ Studying was sufficient for passing; the author wrongly treats it as required.","No testimony appears in the argument.","No generalization from a sample occurs.","No word changes meaning."],takeaway:"Negating the trigger of a conditional proves nothing — memorize 'confuses sufficient with necessary'."},{id:"flaw-2",type:"flaw",level:2,stimulus:"The mayor's proposal to expand the public library is a bad idea. The mayor has not voluntarily read a book since he was in school.",question:"The argument is most vulnerable to criticism on the grounds that it",choices:["assumes without warrant that libraries contain only books","rejects a proposal merely by criticizing the character or habits of the person who made it","confuses a necessary condition with a sufficient one","generalizes from an unrepresentative sample of libraries"],answer:1,evidence:["The mayor rarely reads books."],conclusion:"The library-expansion proposal is BAD.",steps:[{title:"Separate speaker from claim",text:"The evidence is entirely about the mayor as a person. The conclusion is about the merits of a proposal."},{title:"Name it",text:"Attacking the source rather than the argument is the ad hominem flaw. LSAT phrasing: 'criticizes the proponent rather than the proposal'."},{title:"Remember why it's a flaw",text:"Even a non-reader can propose an excellent library. The person's traits don't determine the plan's quality."}],why:["The argument never discusses library contents.","✔ Textbook ad hominem: it attacks the person instead of evaluating the proposal.","No conditional reasoning is present.","No sample or generalization appears."],takeaway:"Evidence about WHO made a claim can never establish that the claim is false."},{id:"flaw-3",type:"flaw",level:3,stimulus:"Since Fairview's curbside recycling program began five years ago, the percentage of the city's households that recycle has declined from 62 percent to 55 percent. The program has therefore failed to increase recycling in Fairview.",question:"The argument is flawed in that it fails to consider the possibility that",choices:["some households recycle without participating in the curbside program","the number of households recycling has risen even though the percentage has fallen","other cities' recycling programs have been more successful than Fairview's","the cost of the program has risen faster than the city anticipated","recycling rates fluctuate seasonally within any given year"],answer:1,evidence:["Recycling households: 62% → 55%."],conclusion:"The program failed to INCREASE recycling.",steps:[{title:"Percent vs. number",text:"A percentage has a denominator. If Fairview's household count grew substantially, 55% of a much bigger city can be far MORE households than 62% of the old one."},{title:"Do the arithmetic",text:"62% of 10,000 = 6,200 households. 55% of 20,000 = 11,000 households. The percentage dropped while recycling nearly doubled."},{title:"Match the answer",text:"(B) states exactly this overlooked possibility. Notice the correct flaw answer describes a possibility the author never ruled out."},{title:"Dismiss the distractors",text:"(A) is tempting but about program participation, not the total amount of recycling the conclusion addresses; (C), (D), (E) are off-topic comparisons or irrelevancies."}],why:["Would mean the percentage understates recycling, but it doesn't explain the key percent/number distinction the conclusion turns on.","✔ A rising household count lets the raw number of recyclers grow while the percentage falls.","Comparisons to other cities are irrelevant to whether this program increased recycling.","Cost is not the issue; the conclusion is about recycling levels.","Seasonal noise doesn't explain a five-year trend."],takeaway:"Whenever a percentage changes, ask what happened to the underlying total."},{id:"flaw-4",type:"flaw",level:4,stimulus:"Sociologist: Critics object that our university ranking fails to measure teaching quality. But every alternative ranking that researchers have designed produces an ordering of universities closely correlated with ours. The critics' objection therefore has no force.",question:"The sociologist's reasoning is most vulnerable to criticism on the grounds that it",choices:["takes agreement among measures to establish their validity, overlooking that they may share the same deficiency","presumes that a ranking is useful only if it measures teaching quality","infers from the fact that critics have not produced a better measure that no better measure could exist","treats a correlation between two orderings as showing that one causes the other","relies on researchers whose interests may be served by agreement with the existing ranking"],answer:0,evidence:["Every alternative ranking correlates closely with ours."],conclusion:"The 'doesn't measure teaching quality' objection has NO FORCE.",steps:[{title:"Restate the move",text:"'Other instruments agree with mine, so mine is fine.' Agreement is being used as evidence of validity."},{title:"Find the hidden possibility",text:"If all the rankings lean on the same inputs — endowment, selectivity, reputation — they will agree beautifully and all ignore teaching quality equally. Consensus among biased instruments proves nothing."},{title:"Separate (A) from (C)",text:"(C) describes an appeal-to-ignorance structure, but the sociologist doesn't argue from the ABSENCE of a better measure — alternatives were in fact produced. So (C) misdescribes the argument."},{title:"Rule of thumb",text:"On hard Flaw questions, eliminate answers that describe reasoning the author never performed, even if they name real fallacies."}],why:["✔ Correlated measures can share the very blind spot the critics identified, so agreement doesn't answer the objection.","Reverses the argument; the sociologist is defending the ranking, not setting this requirement.","Misdescribes: alternatives WERE designed, so this isn't an argument from absence of evidence.","No causal claim is made between the two orderings.","A possible real-world worry, but the argument doesn't depend on researchers' motives."],takeaway:"Convergent measures can be convergently wrong. And always check that the flaw described actually happened in the stimulus."}],sg=[{id:"inference-1",type:"inference",level:1,stimulus:"All of the paintings in the Riverside Gallery were made by local artists. Some of the paintings in the Riverside Gallery are watercolors.",question:"Which one of the following must be true?",choices:["All watercolors are made by local artists.","At least one watercolor was made by a local artist.","Most local artists paint watercolors.","The gallery owns more watercolors than oil paintings."],answer:1,evidence:["All gallery paintings → by local artists.","SOME gallery paintings are watercolors."],conclusion:"(You must build this yourself.)",steps:[{title:"Overlap the two facts",text:"The watercolors are gallery paintings. Every gallery painting is by a local artist. So those watercolors are by local artists."},{title:"Keep the quantifier honest",text:"We only know SOME gallery paintings are watercolors, so the conclusion must stay at 'at least one'."},{title:"Stay inside the gallery",text:"(A) talks about ALL watercolors everywhere — the premises only cover paintings in this gallery."}],why:["Goes beyond the gallery; watercolors elsewhere are unaddressed.","✔ Combines 'some gallery paintings are watercolors' with 'all are by locals'.","No information about what local artists generally paint.","No counts are given."],takeaway:"Inference answers never add new scope. Combine the given facts and keep every quantifier as weak as it was."},{id:"inference-2",type:"inference",level:2,stimulus:"Every student in the seminar must submit either a research paper or a translation. No student who submits a translation may enroll in the practicum. Jae is a student in the seminar and is enrolled in the practicum.",question:"Which one of the following must be true?",choices:["Jae will submit a research paper.","Jae would prefer to submit a translation.","Every student in the practicum submits a research paper.","No student submits both a research paper and a translation."],answer:0,evidence:["Seminar student → paper OR translation.","Translation → NOT practicum.","Jae: seminar student AND practicum."],conclusion:"(You must build this yourself.)",steps:[{title:"Contrapose",text:"'Translation → not practicum' contraposes to 'practicum → no translation'. Jae is in the practicum, so Jae submits no translation."},{title:"Use the either/or",text:"Seminar students must do one of the two. Jae is a seminar student and can't do the translation, so the research paper is forced."},{title:"Watch the scope on (C)",text:"(C) is about every practicum student. Practicum students who aren't in the seminar face no such requirement. Scope error."}],why:["✔ Contrapositive eliminates the translation; the either/or forces the paper.","Preferences are never inferable.","Too broad — the rule applies only to seminar students.","The 'either/or' is inclusive; doing both isn't ruled out."],takeaway:"Contrapose, then eliminate. 'Either/or' plus the elimination of one branch forces the other."},{id:"inference-3",type:"inference",level:3,stimulus:"Chesterton's building code requires automatic sprinklers in any structure taller than five stories that was constructed after 1990. Every structure in Chesterton complies with the building code. The Delmar Building, which stands in Chesterton, is seven stories tall and has no automatic sprinklers.",question:"The statements above, if true, most support which one of the following?",choices:["The Delmar Building was constructed in 1990 or earlier.","Most buildings in Chesterton taller than five stories have sprinklers.","No building constructed before 1990 in Chesterton has sprinklers.","The Delmar Building would be required to add sprinklers if it were renovated.","Chesterton's code is stricter than the codes of neighboring towns."],answer:0,evidence:["(>5 stories AND built after 1990) → sprinklers required.","All Chesterton structures comply.","Delmar: 7 stories, NO sprinklers."],conclusion:"(You must build this yourself.)",steps:[{title:"Set up the compound trigger",text:"The requirement fires only when BOTH conditions hold: taller than five stories AND built after 1990."},{title:"Run the contrapositive",text:"No sprinklers (and compliance) → the trigger did not fire → NOT (>5 stories AND post-1990). Delmar IS over five stories, so the other conjunct must fail: it was not built after 1990."},{title:"Reject additions",text:"(C) flips the rule into a prohibition — the code never says pre-1990 buildings LACK sprinklers. (D) invents a renovation rule."}],why:["✔ Since compliance holds and one conjunct is satisfied, the other must be false.","No information about how many other tall buildings have sprinklers.","Confuses 'not required' with 'forbidden'.","The stimulus says nothing about renovations.","No comparison with other towns is given."],takeaway:"Negating a compound trigger (A AND B) only tells you at least ONE conjunct fails. Check which one survives."},{id:"inference-4",type:"inference",level:4,stimulus:"Every grant awarded by the Hale Fund goes to a project that has been peer reviewed. Most peer-reviewed projects at the Institute are collaborative, and no collaborative project at the Institute lacks an external partner. Some Hale Fund grants were awarded to Institute projects.",question:"Which one of the following must be true?",choices:["Most projects that received Hale Fund grants are collaborative.","At least one peer-reviewed Institute project received a Hale Fund grant.","Every Institute project with an external partner is collaborative.","Most Institute projects have external partners.","Some collaborative Institute projects received Hale Fund grants."],answer:1,evidence:["Hale grant → peer reviewed.","MOST peer-reviewed Institute projects are collaborative.","Collaborative Institute project → external partner.","SOME Hale grants went to Institute projects."],conclusion:"(You must build this yourself.)",steps:[{title:"Combine only what chains",text:"Some Hale grants → Institute projects. All Hale grants → peer reviewed. So at least one Institute project that was peer reviewed got a Hale grant. That's (B), guaranteed."},{title:"Why 'most' can't travel",text:"'Most peer-reviewed Institute projects are collaborative' describes the whole peer-reviewed pool. The handful that got Hale grants could all sit in the non-collaborative minority. So (A) and (E) are possible, not necessary."},{title:"Check direction on (C)",text:"The rule is collaborative → external partner. (C) reverses it. Reversals are never guaranteed."},{title:"Check scope on (D)",text:"Most PEER-REVIEWED Institute projects are collaborative — not most Institute projects overall. The non-reviewed ones are a blind spot."}],why:["'Most' applies to the peer-reviewed pool, not to grantees; the overlap could be entirely in the minority.","✔ Follows directly from 'some grants went to Institute projects' plus 'all grants are peer reviewed'.","Reverses the collaborative → external partner rule.","Scope shift from 'most peer-reviewed Institute projects' to 'most Institute projects'.","Could be true, but nothing forces the grantees into the collaborative majority."],takeaway:"'Most' statements don't transfer to subgroups. Only guaranteed overlaps survive on Must Be True."},{id:"paradox-1",type:"paradox",level:1,stimulus:"Rainfall in the Alder Valley this summer was far above average. Yet the town reservoir, which collects rainwater, is lower than usual.",question:"Which one of the following, if true, most helps to explain the situation above?",choices:["The town has a second, smaller reservoir.","Nearly all of the summer's rain fell outside the area that drains into the reservoir.","Rainfall last summer was below average.","Residents are encouraged to conserve water."],answer:1,evidence:["Rainfall far above average."],conclusion:"Reservoir is LOWER than usual. (Surprising!)",steps:[{title:"State the puzzle in one line",text:"More rain should mean more water collected — but the reservoir fell."},{title:"Look for the hidden link",text:"The link is 'rain in the region' = 'rain into the reservoir'. Break that link and the puzzle dissolves."},{title:"Confirm",text:"(B) says the rain fell outside the watershed, so the reservoir never received it. Both facts are now comfortably true at once."}],why:["A second reservoir doesn't explain why this one is low.","✔ Rain that misses the watershed never reaches the reservoir.","Last summer doesn't explain this summer's result.","Conservation would raise, not lower, the level."],takeaway:"Resolve the paradox by making BOTH facts true at once — usually by breaking an assumed connection."},{id:"paradox-2",type:"paradox",level:2,stimulus:"Ridgefield's new expressway allows traffic to move at twice the speed of the old road it replaced. Nevertheless, in the three years since it opened, the average commute time for Ridgefield residents has increased.",question:"Which one of the following, if true, most helps to resolve the discrepancy?",choices:["The expressway cost more to build than originally projected.","Because commuting became easier, many residents moved to far-distant suburbs and now travel much greater distances to work.","A few residents continue to use the old road out of habit.","Ridgefield's population has remained stable since the expressway opened."],answer:1,evidence:["Expressway doubles travel speed."],conclusion:"Average commute TIME has increased. (Surprising!)",steps:[{title:"Decompose time",text:"Time = distance ÷ speed. Speed went up, so if time also went up, distance must have risen even more."},{title:"Find the mechanism",text:"(B) supplies it: faster roads induced people to live farther away, increasing distance enough to swamp the speed gain."},{title:"Test the others",text:"Cost (A) is irrelevant; (C) covers only a few people; (D) removes a possible explanation rather than giving one."}],why:["Construction cost has nothing to do with travel time.","✔ Longer distances outweigh the higher speed — both facts hold.","Too small an effect to move the average.","Rules out an explanation instead of supplying one."],takeaway:"When a rate improves but the outcome worsens, look for a change in the other variable in the formula."},{id:"paradox-3",type:"paradox",level:3,stimulus:"At Mercy General, patients operated on by the hospital's most experienced surgeons die within thirty days of surgery at a higher rate than patients operated on by its least experienced surgeons. Yet reviews of operative records show that the experienced surgeons commit markedly fewer technical errors.",question:"Which one of the following, if true, most helps to explain the results described above?",choices:["Experienced surgeons perform a greater number of operations per year than inexperienced surgeons do.","The hospital assigns its most medically complex and high-risk cases to its most experienced surgeons.","Technical errors during surgery rarely result in death within thirty days.","Inexperienced surgeons are supervised during their first two years of practice.","Mercy General's overall thirty-day mortality rate is lower than the national average."],answer:1,evidence:["Experienced surgeons: HIGHER 30-day mortality.","Experienced surgeons: FEWER technical errors."],conclusion:"Both facts are true at once. Explain how.",steps:[{title:"Name the missing variable",text:"Mortality depends on more than surgeon skill — above all, on how sick the patient was going in. The stimulus never equalizes patient risk."},{title:"Apply case-mix",text:"(B) says the sickest patients are routed to the best surgeons. Their patients die more often because of who the patients are, not how the surgery went."},{title:"Why (C) is the strongest trap",text:"(C) explains why FEWER ERRORS doesn't lower mortality, but it never explains why experienced surgeons' patients die at a HIGHER rate. A paradox answer must account for the direction of the gap, not just mute one factor."},{title:"Technique",text:"Always ask: does this answer explain the actual direction of the surprising result?"}],why:["Volume alone doesn't explain a higher death RATE.","✔ Case-mix: the most experienced surgeons take the riskiest patients.","Neutralizes one factor but leaves the higher mortality unexplained.","Supervision might reduce novices' errors, yet their patients' survival edge remains unexplained.","A comparison to national data leaves the internal gap untouched."],takeaway:"In outcome comparisons, the usual resolution is selection: the groups being compared aren't comparable."},{id:"paradox-4",type:"paradox",level:4,stimulus:"A utility compared households that installed rooftop solar panels with closely matched households that did not. The panels reliably generated substantial electricity. Nevertheless, in the year after installation, the solar households purchased more electricity from the grid than the matched households did.",question:"Which one of the following, if true, most helps to explain the utility's finding?",choices:["Rooftop panels generate less electricity in winter than in summer.","Households that install panels typically replace gas furnaces and gasoline cars with electric heat pumps and electric vehicles soon afterward.","The matched households were selected to resemble solar households in income and home size.","Solar panels require occasional cleaning to maintain their output.","Some solar households sell surplus electricity back to the utility during the day."],answer:1,evidence:["Panels generate substantial electricity.","Matched non-solar households bought LESS grid power."],conclusion:"Solar households bought MORE grid power. Explain.",steps:[{title:"Identify the assumed constant",text:"The surprise depends on assuming total electricity demand stays fixed. If demand itself jumps, on-site generation can rise and grid purchases can still rise."},{title:"Supply the demand shock",text:"(B) does exactly this: electrifying heating and driving can add thousands of kilowatt-hours per year — far more than rooftop panels supply."},{title:"Why (E) fails",text:"Selling surplus back concerns exports, not purchases; it doesn't raise the amount bought. (A) and (D) describe modest output dips that cannot outpace the baseline comparison."},{title:"Why (C) is backwards",text:"(C) tightens the match, which makes the finding MORE puzzling rather than less."}],why:["A seasonal dip is offset by summer and doesn't explain a full-year increase.","✔ Electrification massively raises total demand, so grid purchases can rise despite on-site generation.","Deepens the puzzle instead of resolving it.","Maintenance affects output slightly, not enough to flip the comparison.","Concerns electricity sold, not electricity purchased."],takeaway:"Check whether the puzzle assumes a quantity is fixed. Resolutions often come from that quantity changing."},{id:"method-1",type:"method",level:1,stimulus:`Rina: We should buy the blue sofa for the living room.
Tom: We can't. The blue sofa is wider than our front doorway.`,question:"Tom responds to Rina by",choices:["questioning Rina's taste in furniture","pointing out a practical obstacle that would prevent carrying out Rina's proposal","proposing an alternative purchase","citing the opinion of an expert on interior design"],answer:1,evidence:["Rina proposes buying the blue sofa."],conclusion:"Tom: we can't — it won't fit through the door.",steps:[{title:"Describe, don't evaluate",text:"Method questions ask what the speaker DID. Tom raised a physical fact that makes the plan impossible."},{title:"Match the abstraction",text:"'A practical obstacle to carrying out the proposal' describes that move exactly."},{title:"Eliminate what never happened",text:"Tom offers no alternative and names no expert, so those answers describe moves absent from the dialogue."}],why:["Tom never comments on Rina's taste.","✔ He identifies a concrete barrier to executing the plan.","No alternative is suggested.","No expert is cited."],takeaway:"Answer Method questions by narrating the speaker's move, then eliminate any answer describing something that never occurred."},{id:"method-2",type:"method",level:2,stimulus:"Columnist: Opponents warn that the proposed tax will drive small businesses out of the city. The same warning was issued when the city raised its minimum wage five years ago, and in the years that followed the number of small businesses in the city grew steadily.",question:"The columnist argues by",choices:["demonstrating that the opponents have a financial interest in the outcome","citing a previous case in which a similar prediction turned out to be mistaken","showing that the opponents' claim is self-contradictory","appealing to the authority of economic experts"],answer:1,evidence:["Same prediction was made about the minimum-wage increase.","Afterward, small-business numbers GREW."],conclusion:"(Implicit) The current warning should not be believed.",steps:[{title:"Spot the historical parallel",text:"The columnist reaches for an earlier, analogous prediction rather than analyzing the tax directly."},{title:"Note the outcome",text:"That earlier prediction failed. The columnist uses this track record to discredit the new prediction."},{title:"Phrase it abstractly",text:"'Cites a previous case in which a similar prediction proved mistaken' — exactly (B)."}],why:["No motives are discussed.","✔ Uses an analogous past prediction that failed.","No contradiction is alleged.","No experts appear."],takeaway:"Arguments from precedent attack a prediction's track record rather than its content."},{id:"method-3",type:"method",level:3,stimulus:"Philosopher: If beauty were merely subjective, then disputes about art would resemble disputes about favorite flavors — there would be nothing to argue about and no reason anyone's view should change. But people do argue about art, and such arguments frequently do change minds. Beauty, therefore, is not merely subjective.",question:"The philosopher's argument proceeds by",choices:["defining a key term in a way that makes the conclusion true by definition","deriving a consequence from a position, showing that the consequence conflicts with observed facts, and rejecting the position","establishing that a view is held by a minority and inferring that it is false","offering an analogy between artistic judgment and judgments of flavor","showing that two commonly held beliefs cannot both be true"],answer:1,evidence:["IF beauty is subjective → art disputes are pointless and never persuasive.","But art disputes occur AND change minds."],conclusion:"Beauty is NOT merely subjective.",steps:[{title:"Trace the skeleton",text:"Suppose P (subjectivism). Then Q (pointless disputes). Not-Q is observed. Therefore not-P. That is a conditional plus contrapositive — a reductio."},{title:"Beware the analogy trap",text:"(D) notices the flavor comparison, but the analogy is part of the derived consequence, not the argumentative method. The work is done by rejecting the consequence."},{title:"Check (E)",text:"(E) would fit an argument that leaves both beliefs standing in tension. Here the philosopher resolves it by rejecting one side outright."},{title:"Technique",text:"On Method, map the logical form before reading the answers. The form here is modus tollens."}],why:["No definition is stipulated.","✔ Modus tollens: derive a consequence, falsify it, reject the original position.","No appeal to popularity appears.","The analogy illustrates the consequence; it isn't the method of proof.","The argument rejects a position rather than leaving a standoff."],takeaway:"'If their view were right, X would follow; X is false; so their view is wrong' = reductio / modus tollens."},{id:"method-4",type:"method",level:4,stimulus:"Economist: The claim that rent regulation shrinks the housing supply rests entirely on studies of cities whose regulations covered newly built units. In cities whose regulations exempt new construction, supply has not declined. The evidence advanced thus establishes only a far narrower claim than the one being made — which is not to say the broader claim is false.",question:"The economist's argument proceeds by",choices:["rejecting a general claim on the ground that a single counterexample to it exists","distinguishing two versions of a policy in order to show that the cited evidence supports only a narrower claim, while declining to assert that the broader claim is untrue","arguing that because a claim has not been proven, it should be presumed false","attacking the methodology of the studies by showing that their samples were too small","conceding the opponents' conclusion while objecting to the way they have stated it"],answer:1,evidence:["Evidence comes only from cities regulating NEW units.","Where new construction is exempt, supply did not fall."],conclusion:"The evidence supports only a NARROWER claim (explicitly not: the broad claim is false).",steps:[{title:"Read the final clause carefully",text:"'Which is not to say the broader claim is false' is a deliberate disclaimer. Any answer saying the economist rejects or refutes the broad claim is out."},{title:"Identify the actual move",text:"The economist splits rent regulation into two kinds and shows the data only covers one kind. That limits the evidence's reach."},{title:"Kill (A) and (C)",text:"(A) claims a refutation by counterexample — but the economist expressly withholds refutation. (C) is the appeal-to-ignorance structure, also disclaimed."},{title:"Kill (D) and (E)",text:"(D) invents a sample-size critique never made. (E) says the economist concedes the conclusion, but the economist takes no position on its truth."}],why:["The economist pointedly declines to call the broad claim false.","✔ Captures both the distinction drawn and the deliberate refusal to refute.","The opposite of the economist's disclaimer.","No sample-size objection is made.","The economist neither concedes nor denies the conclusion."],takeaway:"Hedges and disclaimers in the last sentence are load-bearing; let them eliminate answers that overstate the author's commitment."},{id:"role-1",type:"role",level:1,stimulus:"We should leave for the theater now. The film begins in twenty minutes, and the theater is a half-hour drive away.",question:"The statement that the theater is a half-hour drive away plays which one of the following roles in the argument?",choices:["It is the conclusion the argument is designed to establish.","It is evidence offered in support of the recommendation.","It is a claim the argument sets out to refute.","It is an assumption that the argument leaves unstated."],answer:1,evidence:["The film begins in 20 minutes.","The theater is a 30-minute drive."],conclusion:"We should leave NOW.",steps:[{title:"Find the conclusion first",text:"'We should leave now' is the recommendation; everything else is there to justify it."},{title:"Place the target statement",text:"The drive time is one of two facts supporting the recommendation — a premise."},{title:"Eliminate",text:"It's stated outright, so it can't be an unstated assumption, and nothing in the argument opposes it."}],why:["The conclusion is the recommendation to leave now.","✔ It's a stated premise supporting that recommendation.","Nothing is being refuted.","It's explicitly stated, so it isn't unstated."],takeaway:"Bracket the conclusion first; then ask whether the target statement supports it, is supported by it, or neither."},{id:"role-2",type:"role",level:2,stimulus:"Vitamin supplements are enormously popular. Nevertheless, nutrition surveys show that most adults already obtain adequate amounts of every essential vitamin from their diets. For most adults, then, supplements are unnecessary, whatever manufacturers may claim.",question:"The claim that vitamin supplements are enormously popular plays which one of the following roles?",choices:["It is the main conclusion of the argument.","It is a fact the author acknowledges but treats as not undermining the conclusion.","It is the primary evidence for the conclusion.","It is a principle from which the conclusion is derived."],answer:1,evidence:["Most adults already get adequate vitamins from food."],conclusion:"Supplements are unnecessary for most adults.",steps:[{title:"Follow the pivot word",text:"'Nevertheless' signals that the preceding sentence is being set aside, not relied upon."},{title:"Classify the move",text:"Popularity is conceded as true, then neutralized — a concession or background point, not support."},{title:"Test support direction",text:"Does popularity make supplements unnecessary? No — if anything it cuts the other way. So it can't be the evidence."}],why:["The conclusion is that supplements are unnecessary for most adults.","✔ A conceded point the author then sets aside with 'nevertheless'.","It doesn't support the conclusion; the survey data does.","It's a factual observation, not a general principle."],takeaway:"'Although / nevertheless / admittedly' almost always mark a concession the author will push past."},{id:"role-3",type:"role",level:3,stimulus:"Deforestation in the Menara basin has slowed over the past decade. Satellite measurements show the annual rate of canopy loss falling every year since 2014, and government reforestation programs now cover two million hectares. Since slowing deforestation allows standing forest to accumulate carbon, the basin's forests are now absorbing more carbon than they did a decade ago.",question:"The claim that deforestation in the Menara basin has slowed over the past decade plays which one of the following roles?",choices:["It is the argument's main conclusion.","It is an intermediate conclusion supported by the satellite and reforestation data and used to support the main conclusion.","It is an unsupported premise offered in support of the main conclusion.","It is a generalization that the final sentence shows to be too broad.","It is background information with no role in the reasoning."],answer:1,evidence:["Satellite data: canopy loss falling since 2014.","Reforestation covers 2M hectares."],conclusion:"Forests now absorb MORE carbon than a decade ago.",steps:[{title:"Identify the main conclusion",text:"The last clause — forests absorb more carbon now — is what everything builds toward."},{title:"Check both directions for the target claim",text:"The satellite and reforestation facts support 'deforestation has slowed'; 'deforestation has slowed' in turn supports the carbon claim. Supported AND supporting = intermediate conclusion."},{title:"Why (C) is the trap",text:"(C) gets the supporting half right but calls it unsupported. The second sentence is evidence FOR it, so it isn't a bare premise."},{title:"Technique",text:"For Role questions, always test support in BOTH directions before choosing."}],why:["The main conclusion is the carbon-absorption claim.","✔ It receives support from the data and provides support for the final claim.","Half right: it does support the conclusion, but it is itself supported.","Nothing in the argument limits or corrects it.","It is central to the chain of reasoning, not inert background."],takeaway:"A claim that is both supported and supporting is a subsidiary (intermediate) conclusion."},{id:"role-4",type:"role",level:4,stimulus:"Historian: It is often said that the printing press caused the Reformation. Yet presses operated widely for sixty years before Luther, and literacy rates barely moved in that interval. The press was therefore at most an amplifier of a movement whose causes lie elsewhere — though without the press, Luther's ideas would certainly have spread far more slowly.",question:"The claim that without the press Luther's ideas would have spread far more slowly plays which one of the following roles?",choices:["It is the main conclusion of the historian's argument.","It is evidence that the press caused the Reformation.","It is a qualification that limits the historian's conclusion without retracting it.","It is a position the historian rejects on the basis of literacy data.","It is an assumption required for the claim about literacy rates to be relevant."],answer:2,evidence:["Presses were widespread 60 years pre-Luther.","Literacy barely rose in that period."],conclusion:"The press was AT MOST an amplifier; causes lie elsewhere.",steps:[{title:"Locate the conclusion",text:"'The press was therefore at most an amplifier' carries the 'therefore'. That's the main conclusion."},{title:"Read the 'though' clause",text:"'Though without the press…' concedes a genuine effect of the press while leaving the causal conclusion intact. The word 'amplifier' already allows for it."},{title:"Eliminate (B) and (D)",text:"(B) makes it evidence for a thesis the historian denies. (D) treats it as rejected — but the historian asserts it as true."},{title:"Eliminate (E)",text:"The literacy data stands on its own; this concession isn't needed to make it relevant."}],why:["The conclusion is the 'at most an amplifier' claim.","It's compatible with the historian's view, not evidence against it.","✔ A concession that narrows the conclusion's scope while affirming it.","The historian endorses this statement rather than rejecting it.","Not needed for the literacy evidence to bear on the causal claim."],takeaway:"Statements the author asserts but that don't support the conclusion are usually concessions or qualifications."},{id:"conclusion-1",type:"conclusion",level:1,stimulus:"Dogs need daily exercise to stay healthy. A tired dog is also far less likely to chew the furniture. So you should walk your dog every day.",question:"Which one of the following most accurately expresses the main conclusion?",choices:["Dogs need daily exercise to stay healthy.","You should walk your dog every day.","Tired dogs chew less furniture.","Furniture damage is a common problem for dog owners."],answer:1,evidence:["Dogs need daily exercise.","Tired dogs chew less furniture."],conclusion:"You should walk your dog every day.",steps:[{title:"Find the signal word",text:"'So' introduces the conclusion. Everything before it is support."},{title:"Apply the Why test",text:"Ask 'why should I walk my dog daily?' — the other two sentences answer. Ask 'why do dogs need exercise?' — nothing answers. The recommendation is on top."},{title:"Note",text:"Main Conclusion answers restate the claim; they never add new content."}],why:["A premise supporting the recommendation.","✔ The recommendation everything else supports.","A second supporting premise.","Never stated in the argument."],takeaway:"Use the Why test: the claim answered by the others — and answering none itself — is the main conclusion."},{id:"conclusion-2",type:"conclusion",level:2,stimulus:"Some trustees argue that the museum should close on Mondays to reduce operating costs. However, Monday is the only day on which many shift workers can visit. The museum should stay open seven days a week, trimming its acquisitions budget if necessary.",question:"Which one of the following most accurately expresses the main conclusion?",choices:["The museum should reduce its acquisitions budget.","Shift workers can visit the museum only on Mondays.","The museum should remain open every day of the week.","Closing on Mondays would reduce the museum's operating costs."],answer:2,evidence:["Monday is the only day many shift workers can come.","(Trustees' view: close Mondays to save money.)"],conclusion:"Stay open seven days a week.",steps:[{title:"Separate the opposing view",text:"The first sentence is what OTHERS argue. 'However' marks the author's turn against it."},{title:"Spot the author's claim",text:"The last sentence is the author's recommendation: stay open seven days."},{title:"Handle the trailing clause",text:"'Trimming its acquisitions budget if necessary' is a subordinate concession about how, not the main point."}],why:["A conditional concession attached to the real conclusion.","A premise supporting staying open.","✔ The author's recommendation.","The opposing side's premise."],takeaway:"Views introduced as what 'some argue' are never the author's conclusion — look after the pivot word."},{id:"conclusion-3",type:"conclusion",level:3,stimulus:"The proposal to lower the legal drinking age deserves serious consideration; critics' fears about it are overstated. Countries with lower drinking ages report fewer episodes of binge drinking among young adults, and their traffic fatality rates have not risen. Opponents point to one study showing increased hospital admissions, but that study tracked a single city over six months.",question:"Which one of the following most accurately expresses the main conclusion of the argument?",choices:["Critics' fears about lowering the drinking age are entirely unfounded.","The proposal to lower the legal drinking age merits serious consideration.","Countries with lower drinking ages have less binge drinking among young adults.","The study cited by opponents was too limited to support their position.","The legal drinking age should be lowered."],answer:1,evidence:["Lower-age countries: less binge drinking, no rise in fatalities.","Opponents' study: one city, six months."],conclusion:"The proposal DESERVES SERIOUS CONSIDERATION.",steps:[{title:"Don't assume the conclusion comes last",text:"Here it opens the stimulus. The remaining sentences all explain why the proposal merits consideration."},{title:"Respect the conclusion's strength",text:"'Deserves serious consideration' is modest. (E) 'should be lowered' is a much stronger claim the author never makes."},{title:"Watch for overstatement in (A)",text:"The author says fears are 'overstated', not 'entirely unfounded'. Main Conclusion answers must match the original wording's force exactly."},{title:"Classify (D)",text:"(D) is a supporting attack on the opposition's evidence — a premise, not the conclusion."}],why:["Overstates 'overstated' into 'entirely unfounded'.","✔ Matches the author's actual claim and its modest strength.","A premise drawn from international data.","A supporting criticism of the opponents' evidence.","Stronger than anything the author asserts."],takeaway:"The main conclusion can appear anywhere. Match its strength word-for-word — hedges matter."},{id:"conclusion-4",type:"conclusion",level:4,stimulus:"Public health officials urge extending routine screening to adults in their forties. Extending it, however, would generate large numbers of false positives, each prompting invasive follow-up procedures that carry their own risks. Early detection does save some lives in this age group; even so, the harms of over-diagnosis here outweigh those gains. The officials' recommendation should not be adopted — unless, of course, a substantially more specific test becomes available.",question:"Which one of the following most accurately expresses the main conclusion?",choices:["Early detection saves no lives among adults in their forties.","The harms of over-diagnosis in this age group outweigh the benefits of early detection.","With the tests currently available, the recommendation to extend routine screening should not be adopted.","Routine screening should never be extended to adults in their forties.","Invasive follow-up procedures carry risks that officials have ignored."],answer:2,evidence:["Extension → many false positives → risky follow-ups.","Early detection saves some lives.","Intermediate: harms outweigh gains."],conclusion:"The recommendation should NOT be adopted — unless a more specific test appears.",steps:[{title:"Find the recommendation",text:"'The officials' recommendation should not be adopted' is the author's verdict — the final judgment the rest builds toward."},{title:"Don't drop the 'unless'",text:"The closing clause conditions the verdict on current test technology. Any answer must preserve that limit, which is why (D)'s 'never' fails."},{title:"Spot the intermediate conclusion",text:"(B) 'harms outweigh gains' is itself supported by the false-positive evidence and then used to support the verdict. Classic subsidiary conclusion trap."},{title:"Reject the distortions",text:"(A) contradicts the stimulus, which grants that some lives are saved. (E) adds an accusation the author never makes."}],why:["Contradicts the explicit concession that some lives are saved.","The intermediate conclusion — supported, and used as support.","✔ States the final verdict and preserves the 'current tests' qualification.","'Never' ignores the 'unless a better test arrives' clause.","Not claimed; the author doesn't accuse officials of ignoring anything."],takeaway:"Beware subsidiary conclusions, and carry every qualifier ('unless', 'currently') into the answer."}],og=[{id:"principle-1",type:"principle",level:1,stimulus:"Principle: A person should apologize whenever he or she has caused another person harm, even if the harm was unintentional.",question:"Which one of the following judgments most closely conforms to the principle above?",choices:["Pat bumped into Dev and spilled his coffee by accident; Pat should apologize to Dev.","Ravi thought about tripping Sam but did not; Ravi should apologize to Sam.","Mia disagreed loudly with Jo but caused her no harm; Mia should apologize to Jo.","Lee was harmed by a falling branch; the tree's owner need not apologize."],answer:0,evidence:["Caused harm (even unintentionally) → should apologize."],conclusion:"Apply the rule to one of the four cases.",steps:[{title:"Diagram the principle",text:"Caused harm → apologize. 'Even unintentional' tells you intent is irrelevant to the trigger."},{title:"Check each case for the trigger",text:"Only one case involves actual harm actually caused: Pat spilled Dev's coffee. The trigger fires, so the conclusion 'should apologize' follows."},{title:"Reject non-triggers",text:"No harm caused means the rule says nothing — it never tells you that an apology is NOT owed, so (D)-style answers are out of scope."}],why:["✔ Harm caused (accidentally), so an apology is owed under the rule.","No harm occurred, so the rule never applies.","No harm occurred, so the rule never requires an apology.","The rule only says when apologies ARE owed, never when they aren't."],takeaway:"A principle is a conditional. Find the case whose facts fire the trigger — and never use it in reverse."},{id:"principle-2",type:"principle",level:2,stimulus:"Marcus had promised to help Lena move on Saturday. On Friday a friend offered him a ticket to a sold-out concert taking place Saturday afternoon. Marcus declined the ticket and helped Lena move.",question:"Which one of the following principles, if valid, most helps to justify Marcus's decision?",choices:["A person should always choose the activity that benefits the greatest number of people.","An obligation one has voluntarily undertaken takes precedence over an opportunity for one's own enjoyment.","One should never accept gifts from friends when one has prior commitments.","Promises may be broken whenever the cost of keeping them is high."],answer:1,evidence:["Marcus promised to help Lena.","He gave up the concert to keep the promise."],conclusion:"Marcus's choice was justified.",steps:[{title:"Name the two competing things",text:"On one side: a voluntarily made promise. On the other: personal enjoyment. The justifying principle must rank the first above the second."},{title:"Match precisely",text:"(B) does exactly that and uses language ('voluntarily undertaken obligation', 'own enjoyment') that maps onto the facts."},{title:"Check scope errors",text:"(A) brings in head-counting that the facts never establish. (D) would justify the opposite choice."}],why:["The facts never tell us how many people each option benefits.","✔ Ranks the promise above personal enjoyment, justifying the choice made.","Overbroad and mismatched — the issue isn't accepting gifts.","Would license breaking the promise, the opposite result."],takeaway:"A justifying principle must rank the exact values in conflict — and must support the choice actually made."},{id:"principle-3",type:"principle",level:3,stimulus:"Principle: An employee is justified in disclosing an employer's confidential information only if the disclosure is necessary to prevent serious harm to the public and the employee has first raised the concern through internal channels without obtaining a response.",question:"Which one of the following judgments most closely conforms to the principle?",choices:["Ndidi reported to regulators that her company was concealing a defect that could cause fatal crashes; she had twice reported the defect to her supervisors, who did nothing. Her disclosure was justified.","Owen disclosed his firm's marketing plans to a journalist after management ignored his memo about them. His disclosure was justified.","Priya learned of a contamination risk to a city's water supply and immediately informed the press without notifying anyone at her company. Her disclosure was justified.","Quinn raised a safety concern internally an
