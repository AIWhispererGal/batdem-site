d received no reply, but said nothing publicly. His silence was unjustified.","Rosa disclosed a hazard to the public after internal complaints were ignored; because disclosure is sometimes unjustified, hers was unjustified."],answer:0,evidence:["Justified → (1) necessary to prevent SERIOUS PUBLIC harm, AND (2) internal channels tried first without response."],conclusion:"Pick the judgment that conforms.",steps:[{title:"Note the 'only if'",text:"These are NECESSARY conditions. Strictly, meeting them doesn't by itself prove justification — but the credited answer is the only one consistent with the rule, and every other answer violates it."},{title:"Run the two-part checklist",text:"(A): fatal crashes = serious public harm ✓; reported twice internally with no action ✓. Both boxes checked and nothing in the rule is violated."},{title:"Eliminate the one-box answers",text:"(B) fails the harm prong — marketing plans aren't public safety. (C) fails the internal-channels prong — she went straight to the press."},{title:"Eliminate the misuse answers",text:"(D) treats the rule as requiring disclosure, which it never does. (E) reasons from 'sometimes unjustified' to 'this one is' — pure non sequitur."}],why:["✔ Satisfies both necessary conditions and conflicts with nothing in the principle.","Confidential marketing plans are not a serious public harm.","Skipped internal channels, violating the second condition.","The principle permits disclosure in some cases; it never requires it.","'Sometimes unjustified' cannot establish that this instance is."],takeaway:"With multi-part principles, build a checklist and eliminate any case that misses a prong or inverts the rule."},{id:"principle-4",type:"principle",level:4,stimulus:"A travel writer accepted an all-expenses-paid stay from a resort and later published a glowing review of it. She disclosed the free stay in the review's first paragraph, and her praise was entirely sincere — independent reviewers largely agree with her assessment. Still, she acted wrongly in accepting the stay.",question:"Which one of the following principles, if valid, most helps to justify the conclusion above?",choices:["A reviewer acts wrongly in publishing a review that misleads readers about a product's quality.","A person acts wrongly in accepting a benefit that gives her an incentive to distort a judgment others rely on her to make impartially, even if she discloses the benefit and is not in fact influenced by it.","A reviewer should disclose any benefit received from the subject of a review.","A person acts wrongly whenever she accepts a gift from someone whose interests may be affected by her work, unless the gift is of trivial value.","Reviews written by reviewers who have accepted gifts are less reliable than reviews written by reviewers who have not."],answer:1,evidence:["She accepted a free stay.","She DISCLOSED it; her praise was SINCERE and corroborated."],conclusion:"She nevertheless ACTED WRONGLY in accepting the stay.",steps:[{title:"Inventory the facts the principle must survive",text:"Disclosure happened. Honest judgment happened. Accuracy was confirmed. So the principle must condemn the acceptance despite all three."},{title:"Why (A), (C), (E) die instantly",text:"(A) requires misleading readers about quality — the review was accurate. (C) is satisfied, so it exonerates rather than condemns. (E) is an empirical generalization contradicted by the corroboration, and it makes no moral claim at all."},{title:"Compare (B) and (D)",text:"(D) is close, but it hinges on the gift's value and on interests being 'affected by her work' — and it would be undercut by the disclosure issue it never addresses. (B) is built precisely to defeat the disclosure and sincerity defenses."},{title:"Confirm (B) reaches the verdict",text:"She accepted a benefit creating an incentive to distort a judgment readers rely on as impartial → wrong, 'even if disclosed and not in fact influenced'. Conclusion justified."}],why:["Requires misleading readers about quality — the review was accurate.","✔ Condemns the acceptance notwithstanding disclosure and actual impartiality, exactly matching the facts.","She did disclose, so this principle would vindicate rather than condemn her.","Turns on the gift's value, a fact the stimulus doesn't settle, and leaves the disclosure defense standing.","A claim about reliability, not about right and wrong — and the facts cut against it."],takeaway:"A justifying principle must survive every exculpating fact in the stimulus. Facts placed there as defenses are the test."},{id:"parallel-1",type:"parallel",level:1,stimulus:"All mammals have hair. Whales are mammals. Therefore, whales have hair.",question:"Which one of the following arguments is most similar in its reasoning to the argument above?",choices:["All squares have four sides. This figure is a square. Therefore, this figure has four sides.","All squares have four sides. This figure has four sides. Therefore, it is a square.","Most birds can fly. Penguins are birds. Therefore, penguins can fly.","No reptiles have hair. Whales have hair. Therefore, whales are not reptiles."],answer:0,evidence:["All A are B.","C is an A."],conclusion:"C is a B.",steps:[{title:"Abstract the form",text:"All A are B. C is an A. So C is a B. Strip the content down to letters before looking at the choices."},{title:"Match letter for letter",text:"(A) is All A (squares) are B (four-sided); C (this figure) is an A; so C is a B. Identical."},{title:"Spot the near-misses",text:"(B) reverses the second premise. (C) swaps 'All' for 'Most'. (D) uses a negative rule and a contrapositive."}],why:["✔ Same universal-rule-plus-instance structure, and both are valid.","Affirms the consequent — invalid, so the form differs.","Uses 'Most' instead of 'All', weakening the structure.","Valid but a different form (negative rule plus contrapositive)."],takeaway:"Translate both the stimulus and the answers into letters. Match structure and validity, never topic."},{id:"parallel-2",type:"parallel",level:2,stimulus:"Everyone who won the raffle received a gift certificate. Tomás received a gift certificate, so Tomás must have won the raffle.",question:"The flawed reasoning above is most similar to the reasoning in which one of the following?",choices:["All senators are at least thirty years old. Rosa is at least thirty, so Rosa is a senator.","All senators are at least thirty years old. Rosa is a senator, so Rosa is at least thirty.","No one under thirty is a senator. Rosa is a senator, so Rosa is at least thirty.","Most senators are lawyers. Rosa is a senator, so Rosa is probably a lawyer."],answer:0,evidence:["Won raffle → got certificate.","Tomás got a certificate."],conclusion:"Tomás won the raffle. (Invalid!)",steps:[{title:"Diagram the flaw",text:"Rule: Won → Certificate. The author observes the RESULT (certificate) and concludes the TRIGGER (won). That's affirming the consequent."},{title:"Find the twin flaw",text:"Parallel Flaw answers must share the same defect. Look for an answer that observes a necessary condition and concludes the sufficient one."},{title:"Confirm (A)",text:"Senator → 30+. Rosa is 30+, concluded senator. Same backwards move."}],why:["✔ Same reversal: observes the necessary condition, concludes the sufficient one.","Perfectly valid — the opposite of what we need.","Valid use of a negative rule.","A 'most' inference, and not clearly flawed in the same way."],takeaway:"On Parallel Flaw, first name the flaw. Then find the answer with the SAME flaw — valid answers are automatically wrong."},{id:"parallel-3",type:"parallel",level:3,stimulus:"Most members of the committee favor the merger, and most of those who favor the merger are shareholders. It does not follow, however, that most members of the committee are shareholders.",question:"Which one of the following arguments is most similar in its reasoning to the argument above?",choices:["Most residents of Calder own cars, and most car owners in Calder commute by highway; it does not follow that most residents of Calder commute by highway.","All residents of Calder own cars, and all car owners commute by highway; it does not follow that all residents commute by highway.","Some residents of Calder own cars, and some car owners commute by highway; therefore some residents commute by highway.","Most residents of Calder own cars; therefore most car owners in Calder are residents of Calder.","Most residents of Calder own cars, and most of them commute by highway; therefore most residents commute by highway."],answer:0,evidence:["Most of group X are Y.","Most Y are Z."],conclusion:"It does NOT follow that most X are Z.",steps:[{title:"Abstract carefully",text:"Most X are Y; most Y are Z; therefore it does NOT follow that most X are Z. The conclusion is a denial of entailment — a statement that the inference fails."},{title:"Why 'most' chains break",text:"'Most Y are Z' counts over all of Y, which may be far larger than the slice of Y that comes from X. So the Z's could all sit outside X."},{title:"Preserve the negative conclusion",text:"Only (A) and (B) deny entailment. (B) uses ALL — and with 'all' the chain DOES follow, so (B) misdescribes a valid chain."},{title:"Confirm (A)",text:"Most residents own cars; most car owners commute by highway; concluding that most residents do is indeed blocked. Same quantifiers, same form, same verdict."}],why:["✔ Identical most–most chain, and identical denial that the conclusion follows.","With 'all', the chain is valid, so denying entailment is wrong.","Chains 'some' with 'some' and asserts a conclusion — different form and a flaw the original doesn't share.","A reversal error, not a broken most-chain.","Commits the very error the original says does not follow."],takeaway:"Match the quantifiers AND the conclusion's polarity — 'it does not follow' arguments need another 'does not follow' answer."},{id:"parallel-4",type:"parallel",level:4,stimulus:"The restaurant cannot be understaffed. If it were understaffed, service would be slow — and service has never been slow on any of the evenings I have dined there.",question:"Which one of the following arguments is most similar in its flawed reasoning to the argument above?",choices:["The bridge cannot be structurally unsound. An unsound bridge would vibrate under heavy loads, and I have never felt it vibrate on the occasions when I have crossed it.","The bridge must be structurally unsound, because unsound bridges vibrate under heavy loads and this bridge vibrates.","The bridge cannot be structurally unsound, because the inspector who examined it has a reputation for thoroughness.","Since most bridges in the region are sound, this bridge is probably sound as well.","If the bridge were unsound it would vibrate; engineers have measured no vibration at any load; so the bridge is sound."],answer:0,evidence:["Understaffed → slow service.","Service never slow ON MY VISITS (a small, self-selected sample)."],conclusion:"Not understaffed. (Flawed: the sample may be unrepresentative.)",steps:[{title:"Separate the valid skeleton from the flaw",text:"The logical frame — P → Q, not-Q, so not-P — is valid. The flaw is in the second premise: 'not-Q' is established only for the speaker's own limited visits."},{title:"State the flaw precisely",text:"The author treats personal, possibly unrepresentative observations as establishing a universal negative."},{title:"Why (E) is the sharpest trap",text:"(E) has the identical logical frame but replaces the anecdote with comprehensive engineering measurements at any load — removing the flaw. Same form, no defect, so it cannot be the parallel-flaw answer."},{title:"Confirm (A)",text:"(A) keeps both the frame and the defect: 'the occasions when I have crossed it' is the same anecdotal sample problem."}],why:["✔ Same contrapositive frame and the same unrepresentative-personal-experience flaw.","Affirms the consequent — a different flaw entirely.","An appeal to authority, not the original's error.","A statistical generalization, structurally unrelated.","Same valid frame, but the flaw is cured by comprehensive measurement — so it isn't parallel."],takeaway:"When the skeleton is valid, the parallel answer must duplicate the EVIDENTIARY flaw, not just the logical shape."},{id:"pointatissue-1",type:"pointatissue",level:1,stimulus:`Ana: Let's order a pizza tonight.
Ben: No, we should cook at home — ordering out is too expensive.`,question:"Ana and Ben disagree about whether",choices:["pizza tastes better than home cooking","they should order a pizza tonight","cooking at home takes a long time","restaurants in the area are overpriced"],answer:1,evidence:["Ana: order pizza.","Ben: no — cook at home."],conclusion:"Find the claim one affirms and the other denies.",steps:[{title:"Apply the two-column test",text:"Write what each speaker commits to. Ana: order pizza = yes. Ben: order pizza = no. Direct clash."},{title:"Require both speakers to speak",text:"A correct answer needs a position from BOTH. Neither mentions taste or how long cooking takes."},{title:"Watch for one-sided topics",text:"Ben alone mentions expense; Ana says nothing about it, so that can't be the point at issue."}],why:["Neither speaker mentions taste.","✔ Ana says yes, Ben says no — a direct contradiction.","Neither speaker discusses cooking time.","Only Ben raises cost; Ana takes no position."],takeaway:"The point at issue must be a claim BOTH speakers address, with opposite answers."},{id:"pointatissue-2",type:"pointatissue",level:2,stimulus:`Lena: The city should build the new stadium. It will create hundreds of jobs.
Omar: Those jobs are overwhelmingly temporary construction work, and the city would spend millions that it could put toward schools instead.`,question:"Lena and Omar disagree over whether",choices:["the stadium project would create any jobs","the city should build the new stadium","the city's schools are underfunded","temporary jobs are worth less than permanent ones"],answer:1,evidence:["Lena: build it — it creates jobs.","Omar: jobs are temporary; money is better spent on schools."],conclusion:"Locate the single genuine clash.",steps:[{title:"Separate conceded from contested",text:"Omar never denies that jobs will be created — he characterizes them. So job creation isn't the disagreement."},{title:"Find the shared question",text:"Both speakers take a position on whether to build: Lena yes, Omar (implicitly but clearly) no."},{title:"Eliminate one-sided answers",text:"Lena says nothing about schools or about the comparative worth of temporary jobs, so (C) and (D) lack her position."}],why:["Omar concedes jobs will exist; he disputes their quality.","✔ Lena supports building; Omar's objections clearly oppose it.","Lena never addresses school funding.","Lena offers no view comparing job types."],takeaway:"Reframing or qualifying a premise is not disagreement. Look for the claim with opposite verdicts on both sides."},{id:"pointatissue-3",type:"pointatissue",level:3,stimulus:`Dr. Shaw: Requiring medical residents to work shifts longer than sixteen hours endangers patients, since fatigue causes clinical errors.
Dr. Oyelaran: At hospitals that capped resident shifts at sixteen hours, overall error rates did not fall; the additional patient handoffs that shorter shifts require introduced errors of their own.`,question:"The dialogue most supports the claim that Shaw and Oyelaran disagree about whether",choices:["fatigue can cause clinical errors","patient handoffs can introduce clinical errors","capping resident shifts at sixteen hours reduces the overall incidence of errors that harm patients","medical residents prefer shorter shifts","hospitals should be required by law to limit resident shifts"],answer:2,evidence:["Shaw: long shifts endanger patients (fatigue → errors).","Oyelaran: capping shifts didn't lower overall error rates (handoff errors)."],conclusion:"Identify the genuine clash.",steps:[{title:"Check the conceded ground",text:"Oyelaran never denies fatigue causes errors — he grants a mechanism and adds a countervailing one. So (A) is agreement, not disagreement."},{title:"Check the silent ground",text:"Shaw never addresses handoffs, so (B) has only one voice."},{title:"Find the overlap",text:"Shaw's position implies that cutting long shifts protects patients; Oyelaran's data says overall errors didn't fall. That's the one claim both address with opposite verdicts."},{title:"Avoid the policy upgrade",text:"(E) adds legal mandates. Neither speaker discusses legislation — a classic scope creep trap."}],why:["Oyelaran doesn't dispute this; it's common ground.","Shaw takes no position on handoffs.","✔ Shaw's claim entails yes; Oyelaran's evidence says no. Both speak; they conflict.","Neither mentions residents' preferences.","Neither speaker addresses legal requirements."],takeaway:"Rule out answers that are conceded by one side or untouched by the other; the clash must be mutual and opposite."},{id:"pointatissue-4",type:"pointatissue",level:4,stimulus:`Tarek: Antiquities acquired before 1970 without documented provenance should be returned to their countries of origin. The absence of documentation makes it likely that such objects were looted.
Ileana: Likelihood is not proof. Where ownership is genuinely uncertain, an object should remain wherever it can best be conserved and studied — and that is usually the institution now holding it.`,question:"Tarek and Ileana are committed to disagreeing about whether",choices:["undocumented antiquities acquired before 1970 were probably looted","an antiquity should be returned to its country of origin when looting is likely but unproven","museums generally conserve antiquities more effectively than other institutions","documentation of provenance is a reliable indicator of lawful acquisition","countries of origin have a legitimate interest in recovering looted antiquities"],answer:1,evidence:["Tarek: undocumented → likely looted → should be returned.","Ileana: likelihood ≠ proof; when uncertain, keep where best conserved."],conclusion:"Pinpoint what they must disagree about.",steps:[{title:"Test (A) against Ileana's words",text:"Ileana says 'likelihood is not proof' — she disputes the inferential weight of likelihood, not the likelihood itself. She never denies looting is probable. So (A) is not a committed disagreement."},{title:"Find the normative clash",text:"Tarek: likely-but-unproven looting → return. Ileana: genuine uncertainty → keep where best conserved. These yield opposite verdicts on the identical case."},{title:"Eliminate the one-sided answers",text:"Tarek says nothing about conservation capability (C) and neither takes a position on (E) — Ileana would likely agree that countries have an interest in recovering proven loot."},{title:"Why (D) misses",text:"Both appear to accept that documentation signals lawful acquisition; their fight is over what to do absent it."}],why:["Ileana challenges the sufficiency of likelihood, not its truth.","✔ Both address this exact case and reach opposite conclusions.","Tarek never compares conservation capabilities.","Common ground rather than a point of conflict.","Neither denies this; Ileana's concern is unproven cases."],takeaway:"Distinguish denying a claim from denying what the claim proves — only the second shows up as the disputed issue here."},{id:"evaluate-1",type:"evaluate",level:1,stimulus:"Maria joined a gym three months ago, and she has lost ten pounds since then. Joining the gym must be what caused her weight loss.",question:"Which one of the following would be most useful to know in evaluating the argument?",choices:["Whether Maria also changed her diet three months ago","Whether the gym is close to Maria's home","Whether Maria's friends belong to the same gym","How much the gym membership costs"],answer:0,evidence:["Joined gym 3 months ago.","Lost 10 pounds since."],conclusion:"The gym CAUSED the weight loss.",steps:[{title:"Identify the causal claim",text:"Gym → weight loss. To evaluate a causal claim, probe for other possible causes."},{title:"Run the two-answer test",text:"If she DID change her diet, the gym may deserve no credit. If she did NOT, the gym's case gets stronger. The two answers push in opposite directions — that's a useful question."},{title:"Compare the others",text:"Cost, distance, and friends don't change the strength of the causal claim either way."}],why:["✔ A yes/no answer swings the argument in opposite directions.","Convenience doesn't bear on the cause of the weight loss.","Irrelevant to what caused the loss.","Cost has no effect on the causal conclusion."],takeaway:"Evaluate questions: pick the question whose opposite answers would strengthen vs. weaken the argument."},{id:"evaluate-2",type:"evaluate",level:2,stimulus:"Last year Fairmont High adopted a new mathematics textbook, and this year's average score on the state math exam rose by nine points. The new textbook is clearly more effective than the old one.",question:"The answer to which one of the following would be most useful in evaluating the argument?",choices:["Whether students enjoyed the new textbook more than the old one","Whether the school also introduced an intensive teacher-training program when it adopted the textbook","Whether the new textbook costs more than the old one","Whether neighboring schools use the same textbook"],answer:1,evidence:["New textbook adopted.","Average exam score +9."],conclusion:"The textbook is MORE EFFECTIVE.",steps:[{title:"Spot the single-cause assumption",text:"The author treats the textbook as the only relevant change. Any simultaneous change is a rival explanation."},{title:"Apply the swing test to (B)",text:"Yes, training was added → the gain may be the training's doing, argument weakened. No other change → the textbook's case is much stronger. Big swing."},{title:"Dismiss non-swingers",text:"Enjoyment, cost, and neighbors' choices leave the causal conclusion untouched regardless of the answer."}],why:["Enjoyment doesn't determine effectiveness on exams.","✔ Reveals whether a concurrent change explains the score gain.","Price is irrelevant to effectiveness.","What other schools use doesn't explain Fairmont's gain."],takeaway:"Ask whether another change happened at the same time — the classic Evaluate question for before/after arguments."},{id:"evaluate-3",type:"evaluate",level:3,stimulus:"Airline executive: By reducing the spacing between rows we can fit thirty additional seats on each aircraft. Since each seat sold adds revenue, and the extra seats add almost nothing to fuel costs, adding the seats will increase the profitability of our flights.",question:"It would be most useful to determine which one of the following in evaluating the executive's argument?",choices:["Whether competing airlines have reduced the spacing between their rows","Whether the additional seats would require the airline to hire more flight attendants","Whether the reduced spacing would drive away enough current passengers to offset the revenue from the added seats","Whether passengers prefer aisle seats to window seats","Whether the aircraft could be reconfigured during scheduled maintenance"],answer:2,evidence:["+30 seats per aircraft.","Each seat sold adds revenue; fuel cost barely changes."],conclusion:"Adding the seats will INCREASE PROFITABILITY.",steps:[{title:"Find the unexamined side of the ledger",text:"The executive counts new revenue and one cost (fuel). What's missing is the possibility of LOST revenue from passengers who refuse the cramped cabin."},{title:"Swing test on (C)",text:"If enough passengers defect, profits fall — conclusion destroyed. If almost none do, the conclusion stands. Maximum swing."},{title:"Why (B) is the runner-up",text:"Staffing costs are real but bounded and small relative to thirty seats' revenue; they could shave the gain without reversing it. (C) can flip the outcome entirely."},{title:"Technique",text:"On Evaluate, rank candidates by how much the two possible answers move the conclusion."}],why:["Competitors' choices don't determine this airline's profit.","A real cost, but too small to reverse the conclusion.","✔ Its two possible answers flip the conclusion between true and false.","Seat-type preference is irrelevant to total profitability.","A scheduling detail, not a profitability factor."],takeaway:"Profit arguments have two sides. The best Evaluate answer targets the side the author never examined."},{id:"evaluate-4",type:"evaluate",level:4,stimulus:"Public health official: Our voluntary needle-exchange program should be judged a success. Among city residents who inject drugs, the annual rate of new HIV infection is one-third as high for program participants as it is for nonparticipants.",question:"The answer to which one of the following would be most useful in evaluating the official's argument?",choices:["Whether the program's budget has grown since it was introduced","Whether, before enrolling, those who chose to participate already shared needles less frequently than nonparticipants did","Whether other cities with needle-exchange programs have seen HIV rates decline","Whether the program also distributes information about treatment for addiction","Whether the city's overall HIV infection rate has declined since the program began"],answer:1,evidence:["Participants' new-HIV rate = 1/3 of nonparticipants' rate."],conclusion:"The VOLUNTARY program is a success (i.e., it works).",steps:[{title:"Flag the word 'voluntary'",text:"Participation is self-selected. The two groups may have differed in risk behavior before the program ever touched them."},{title:"Run the swing test on (B)",text:"If participants already shared needles far less, the gap may reflect who joined rather than what the program did — conclusion gutted. If the groups started out alike, the program's case becomes strong. Full reversal in each direction."},{title:"Why (E) looks good but isn't",text:"A citywide decline is consistent with the program working, but also with region-wide trends; and no decline could still mask a program that prevented a worse rise. Its answers don't cleanly swing the comparison the official relies on."},{title:"Why (C) and (D) fail",text:"(C) is about other cities, not this program's effect here. (D) describes an added service without telling us whether the measured gap is real."}],why:["Budget growth says nothing about effectiveness.","✔ Directly tests the self-selection threat that the whole comparison depends on.","Other cities' results don't validate this city's comparison.","An extra service doesn't tell us whether the observed gap reflects the program.","Ambiguous either way; confounded by citywide trends."],takeaway:"'Voluntary' is a red flag for self-selection. The best Evaluate answer asks whether the groups were comparable to begin with."}],rf=[...ig,...sg,...og];function lg(r,d,l){const c=rf.filter(T=>T.type===r&&T.level===d&&!l.includes(T.id));if(c.length)return c[Math.floor(Math.random()*c.length)]}function rg({p:r,onStart:d,onAdaptive:l,onReview:c,onFlaws:T,onFlawGuide:z,onReset:q,muted:X,setMuted:j}){const A=Bi(r.xp),$=r.attempts?Math.round(r.correct/r.attempts*100):0,M=Ma.filter(R=>r.mastered[R.id  must be true for that jump to work?","Negate an answer. If the argument falls apart, you found it."],miniExample:{stimulus:"All fruit in this bowl is ripe. This apple is ripe.",walkthrough:"The author must connect this apple to this bowl. If the apple is not from the bowl, the bowl fact proves nothing about it."}},sufficient:{plainJob:"Add one fact that makes the conclusion completely guaranteed.",basics:["Think of the argument as a chain of arrows.","The evidence starts the chain; the conclusion is where it must end.","Your answer must fill every broken link, not merely make the conclusion likely."],recipe:["Write what you have on the left.","Write what you need to prove on the right.","Find the missing arrow between them.","Plug the answer in and demand a 100% proof."],miniExample:{stimulus:"Nia is a pilot. Therefore Nia is licensed.",walkthrough:"Add 'Every pilot is licensed.' Now Nia -> pilot -> licensed. The conclusion cannot fail."}},strengthen:{plainJob:"Make the conclusion more believable. You do not need to prove it.",basics:["First find the conclusion; that is the claim you are helping.","Then find its weak spot: another cause, a bad comparison, or a missing link.","A strengthener protects that weak spot or adds fresh supporting evidence."],recipe:["Name the conclusion.","Imagine one reason it could be wrong.","Choose the answer that removes that reason or adds direct support.","Compare finalists: which one helps the most?"],miniExample:{stimulus:"Sunny plants grew taller, so sunlight helped.",walkthrough:"Learning that both groups had identical water and soil removes two rival causes. Sunlight becomes a better explanation."}},weaken:{plainJob:"Make the conclusion less believable. You do not have to prove the opposite.",basics:["The conclusion is a bridge supported by evidence.","To weaken, loosen one bolt in that bridge.","Common bolts are alternative causes, reversed cause and effect, and unfair comparisons."],recipe:["Name exactly what the author concl
