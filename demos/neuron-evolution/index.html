 called spines carry receptors that catch chemical messages from other cells.",inGame:"More dendrites = more receptors = the cell reacts more strongly to the same signal."},axon_hillock:{name:"Axon hillock",plain:"The cell’s “trigger”. Packed with sodium channels, it is where a spike is born once the voltage crosses threshold.",inGame:"This is why firing is all-or-none: either the trigger pulls (1) or it doesn’t (0)."},myelin_sheath:{name:"Myelin sheath",plain:"Fatty insulation wrapped around the axon, like the plastic on a wire. It makes spikes travel much faster.",inGame:"More myelin = signals arrive sooner. Timing matters when several signals must meet at the same cell."},node_of_ranvier:{name:"Node of Ranvier",plain:"Tiny gaps in the myelin where the spike is re-boosted, so it “jumps” from node to node without fading.",inGame:"Keeps your 1s crisp over long distances."},synaptic_cleft:{name:"Synapse & cleft",plain:"The microscopic gap where one neuron squirts chemicals (neurotransmitters) onto the next. The chemical message crosses and the receiving cell reacts.",inGame:"Each connection has a strength. Strength is the dial that programs what the circuit computes."},glutamate:{name:"Glutamate (GLU)",plain:"The brain’s main “go!” chemical. It pushes the next cell’s voltage up, toward firing.",inGame:"Use it to make a cell more likely to fire. Most of your connections will be glutamate."},gaba:{name:"GABA",plain:"The brain’s main “stop!” chemical. It pulls the next cell’s voltage down, away from firing.",inGame:"GABA is how a circuit says “NOT”. You need it for XOR and for adding 1 + 1."},acetylcholine:{name:"Acetylcholine (ACh)",plain:"A fast excitatory chemical that also makes the receiving cell more twitchy — it temporarily lowers the firing threshold.",inGame:"Great when a single input must be enough to fire the cell (OR)."},dopamine:{name:"Dopamine (DA)",plain:"A “volume knob” chemical. It doesn’t fire cells itself so much as boost how strongly they respond to other signals.",inGame:"Dopamine turns up the gain for a moment — and in real brains it helps lock in connections that worked."},threshold:{name:"Firing threshold",plain:"The voltage a cell must reach before it fires. Below it, nothing happens; at it, a full spike fires.",inGame:"A low threshold = trigger-happy. A high threshold = picky. Tuning it is your main tool."},capacitance:{name:"Membrane capacitance",plain:"How much electrical charge the cell membrane can soak up. Think of a bigger bucket: it fills (and drains) more slowly.",inGame:"Low capacitance = fast, snappy reactions. High capacitance = slow, smoothing reactions."},refractory_period:{name:"Refractory period",plain:"After a spike, a cell needs a moment to reset and can’t fire again right away.",inGame:"It stops signals echoing backwards and limits how fast a cell can fire."},coincidence_and:{name:"AND = coincidence detection",plain:"A cell that only fires when two inputs arrive together. Each push alone is too small; both add up past the threshold.",inGame:"AND is multiplication of 1-bit numbers — and the CARRY bit when adding."},convergence_or:{name:"OR = convergence",plain:"A cell where any single strong input is enough to make it fire.",inGame:"Same wiring as AND — just stronger connections. The weights are the program."},gaba_xor:{name:"XOR = “exactly one”",plain:"Fires for one input but not for both. A GABA cell that wakes up only on “both” vetoes the output.",inGame:"XOR is the SUM bit of binary addition: 1 + 1 gives 0 in this column."},half_adder:{name:"Half-adder",plain:"The smallest adding machine: an XOR makes the SUM digit and an AND makes the CARRY digit.",inGame:"1 + 1 = 10 in binary → SUM 0, CARRY 1. Chain these to add bigger numbers."}},cy={1:{goal:"Make this neuron fire on a real signal, but stay quiet for background noise.",analogy:"Like a doorbell: a gentle brush shouldn’t ring it, a real press should."},2:{goal:"Make the output fire only when BOTH inputs are on (A AND B).",analogy:"Like a safe with two keys — one key alone does nothing."},3:{goal:"Make the output fire when EITHER input is on (A OR B).",analogy:"Like two doorbells wired to the same chime."},4:{goal:"Make the output fire when exactly ONE input is on — but not both (XOR).",analogy:"Like a bouncer who lets one guest in, but turns away a pair arriving together."},5:{goal:"Add two 1-bit numbers. Light the SUM bit and the CARRY bit correctly.",analogy:"Like 1 + 1 on paper: write down 0, carry the 1."},6:{goal:"Verify your calculator: add any two numbers from 0 to 3.",analogy:"Two half-adders chained: the carry from the 1s column feeds the 2s column."}},oh={1:[{title:"Welcome to the lab",body:"This glowing cell is a neuron — a single living cell that makes a yes/no decision. By the end you’ll wire cells together to do arithmetic. First, let’s learn how ONE cell works."},{title:"Meet your neuron",body:"Click the neuron. A panel will open showing its live voltage — the cell’s heartbeat.",waitFor:"select_neuron",spotlight:"all",topicId:"soma"},{title:"Give it a nudge",body:"Press the GLU button in the panel (or double-click the cell). Glutamate is the brain’s main “go” chemical. Watch the voltage climb toward the orange threshold line.",waitFor:"inject",spotlight:"selected",topicId:"glutamate"},{title:"All or nothing",body:"If the voltage crosses the threshold, the cell fires a full-size spike — never a half spike. That’s how a cell turns messy signals into clean 1s and 0s.",topicId:"threshold"},{title:"Tune your neuron",body:"Right now this cell is too sluggish to react to a real signal. Use the two sliders: grow Dendrites to 4 (more receptors) and lower the Threshold to about −55 mV.",waitFor:"edit",spotlight:"selected",topicId:"dendrites"},{title:"Run the experiment",body:"Press Run Test on the left. The lab sends silence, weak noise, and a real signal. You pass when only the real signal makes the neuron fire.",waitFor:"run_test"}],2:[{title:"Two inputs, one decision",body:"Two sensory neurons (A and B) now feed one decision cell. Every connection has a strength. AND means the output fires only if both inputs agree.",topicId:"coincidence_and"},{title:"Inspect a connection",body:"Click one of the small badges on the connection lines to examine that synapse.",waitFor:"select_synapse",topicId:"synaptic_cleft"},{title:"Make each input weaker",body:"Right now ONE input is strong enough to fire the output — that’s an OR. Lower Strength to about 0.7 on both connections, so one input falls short but two add up. (Raising the output’s threshold to −51 mV also works.)",waitFor:"edit"},{title:"Test it",body:"Press Run Test. Watch how two small pushes arriving together add up past the threshold — that’s called summation.",waitFor:"run_test"}],3:[{title:"Now the opposite: OR",body:"The output should fire if A, or B, or both are on. That means a single input must be strong enough on its own.",topicId:"convergence_or"},{title:"Inspect a connection",body:"Click a connection badge on one of the lines.",waitFor:"select_synapse"},{title:"Make each input stronger",body:"These connections are too weak to fire the output alone. Raise Strength above 1.2 on both. (Switching the chemical to Acetylcholine makes it even twitchier.)",waitFor:"edit",topicId:"acetylcholine"},{title:"Test it",body:"Press Run Test. Same wiring as AND — only the strengths changed. Weights are the program!",waitFor:"run_test"}],4:[{title:"A problem for pure excitation",body:"XOR needs 1 + 1 to give 0, but “go” signals can only add. The brain’s trick is inhibition: a GABA cell that wakes up only when BOTH inputs fire and silences the output. Red T-bars mark inhibitory links.",topicId:"gaba_xor"},{title:"Find the veto cell",body:"Click the middle neuron. Right now it’s the wrong cell type — it excites instead of inhibits.",waitFor:"select_neuron",spotlight:"hidden"},{title:"Evolve it into an inhibitor",body:"Open Advanced traits → Cell type → Parvalbumin GABA Interneuron. Then click its link to the output cell, switch the chemical to GABA (red) and make it strong (about 2.3).",waitFor:"edit",topicId:"gaba"},{title:"Test it",body:"Press Run Test. On 1 + 1 the GABA cell fires and vetoes the output.",waitFor:"run_test"}],5:[{title:"Build a half-adder",body:"Two circuits side by side: an XOR gives the SUM digit (1s column) and an AND gives the CARRY digit (2s column). In binary, 1 + 1 = 10 → SUM 0, CARRY 1.",topicId:"half_adder"},{title:"Fix the CARRY cell",body:"The CARRY cell is too eager — it fires on a single input. Make it a coincidence detector: lower its two input strengths to about 0.7 (or raise its threshold to −51 mV).",waitFor:"edit",spotlight:"outputs",topicId:"coincidence_and"},{title:"Test it",body:"Press Run Test to check all four additions.",waitFor:"run_test"}],6:[{title:"The finale: a 2-bit calculator",body:"A₀ and A₁ encode a number from 0–3 in binary (so do B₀ and B₁). The carry from the 1s column ripples into the 2s column — exactly what you do on paper.",topicId:"half_adder"},{title:"Try some sums",body:"Press Run Test, then use the Neural Calculator to try ANY sum from 0 + 0 to 3 + 3. Watch the spikes ripple through the circuit and light the answer bits.",waitFor:"run_test",spotlight:"outputs"},{title:"You built a calculator from cells",body:"Keep experimenting: drag cells around, change chemicals, break and fix the circuit. Every real computer adds numbers the same way — you did it with biology."}]},sy={first_spike:{title:"⚡ That was an action potential!",body:"The voltage shot up to about +35 mV in under a millisecond, then dipped below resting before recovering. Every spike is the same size — information is carried by WHEN and how OFTEN cells fire, not by how big the spike is.",topicId:"axon_hillock"},first_inhibit:{title:"Inhibition in action",body:"A cell just dropped below its resting voltage. GABA opened chloride channels and pulled the voltage down, away from threshold. Inhibition is how circuits say “NOT”.",topicId:"gaba"},nt_GLUTAMATE:{title:"Glutamate: the “go” signal",body:"You just released glutamate. It opens channels that let positive sodium ions in, nudging the voltage up (an EPSP). Several nudges that arrive together add up.",topicId:"glutamate"},nt_GABA:{title:"GABA: the “stop” signal",body:"GABA lets negative chloride ions in, pulling the voltage down (an IPSP). It also cancels out excitatory pushes that arrive at the same time.",topicId:"gaba"},nt_ACETYLCHOLINE:{title:"Acetylcholine: fast and twitchy",body:"ACh excites quickly AND temporarily lowers the cell’s threshold, so the very next input has an easier time firing it.",topicId:"acetylcholine"},nt_DOPAMINE:{title:"Dopamine: the volume knob",body:"Dopamine barely moves the voltage itself. Instead it boosts how strongly the cell responds to other inputs for a while — a gain boost.",topicId:"dopamine"},first_edit:{title:"You just “mutated” a trait",body:"In real evolution, small changes to a cell’s traits are kept if they work better. Your fitness score is the % of test cases the circuit gets right. Change a trait → re-test → keep what works."},wire_mode:{title:"Growing a synapse",body:"Click a sender cell, then a receiver cell to wire them together. The chemical you pick decides whether the link excites (GLU, ACh), inhibits (GABA), or boosts (DA).",topicId:"synaptic_cleft"},pipette_mode:{title:"Micro-pipette",body:"Real neuroscientists squirt tiny amounts of a chemical onto a cell to see how it reacts. Pick a chemical below, then click a cell."},weak_signal:{title:"Sub-threshold: felt it, ignored it",body:"A weak signal nudges the voltage a little, but it fades away before reaching threshold. Neurons ignore small noise — unless several small signals arrive together.",topicId:"threshold"},partial_progress:{title:"Fitness, not luck",body:"Some rows passed, some didn’t. That’s evolution at work: you keep what works and keep tweaking the rest. Check the red row for a hint about what to change."}},uy={1:{headline:"A neuron is a threshol ic Spike Booster Repeaters",summary:'Microscopic periodic gaps ($\\sim 1\\ \\mu\\text{m}$) between adjacent myelin sheaths packed with voltage-gated $\\text{Na}^+$ and $\\text{K}^+$ channels. The action potential "jumps" saltatorily from node to node.',biologicalMechanism:"The decaying electrotonic current arriving from the previous internode is boosted back to full amplitude ($+35\\text{ mV}$) at each node, ensuring lossless digital transmission over long distances.",arithmeticRole:"Acts as a digital buffer/repeater line. Eliminates signal degradation and maintains pristine binary pulse fidelity across complex multi-neuron arithmetic nets.",formulaOrFact:"\\text{Saltatory Jump: } \\text{Node}_k \\xrightarrow{\\text{fast}} \\text{Node}_{k+1}",keyStats:[{label:"Node Width",value:"1.0 μm"},{label:"Internode Distance",value:"0.2 – 2.0 mm"},{label:"Nav Clustering",value:"Very High (~1200/μm²)"}],color:"#EAB308"},synaptic_cleft:{id:"synaptic_cleft",title:"Synaptic Cleft & Terminal Bouton",category:"anatomy",subtitle:"Neurochemical Transduction & Programmable Weight Interface",summary:"A sub-microscopic 20nm gap separating the presynaptic axonal terminal from the postsynaptic dendritic membrane. Action potentials trigger calcium influx, fusing neurotransmitter vesicles to release chemical packets.",biologicalMechanism:"Voltage-gated $\\text{Ca}^{2+}$ channels ($\\text{Cav}$) open $\\rightarrow \\text{Ca}^{2+}$ influx triggers synaptotagmin and SNARE complexes $\\rightarrow$ exocytosis of vesicles containing Glutamate, GABA, ACh, or Dopamine.",arithmeticRole:"Acts as the programmable multiplier weight ($w_{ij}$). Receptor density determines the magnitude of EPSP/IPSP injected into the downstream neuron ($I = w \\cdot \\text{Spike}$).",formulaOrFact:"I_{syn}(t) = w \\cdot g_{max} \\cdot e^{-t/\\tau} \\cdot (V_m - E_{rev})",keyStats:[{label:"Cleft Width",value:"20 nm"},{label:"Vesicle Diameter",value:"40 nm (~5,000 molecules)"},{label:"Synaptic Delay",value:"0.3 – 1.0 ms"}],
